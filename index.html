<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Neonatal Nursing LMS</title>
<script src="config.js"></script>
<style>
:root{
  --ink:#0b1a20; --ink-soft:#2d4850; --muted:#5d7a85;
  --brand:#0d7d76; --brand-600:#096560; --brand-700:#075049;
  --brand-50:#e7f4f3; --brand-100:#cfe9e6; --brand-200:#a5d7d2;
  --accent:#7c3aed; --accent-50:#f3eefe;
  --ok:#166534; --ok-50:#dcfce7; --bad:#b91c1c; --bad-50:#fee2e2;
  --warn:#b45309; --warn-50:#fef3e2; --gold:#b8860b;
  --bg:#eef5f5; --card:#fff; --line:#d3e3e6; --line-soft:#e8f1f2;
  --radius:14px; --radius-sm:10px;
  --shadow:0 1px 3px rgba(11,26,32,.08),0 8px 28px rgba(11,26,32,.06);
  --shadow-lg:0 12px 40px rgba(11,26,32,.12);
  --grad:linear-gradient(135deg,#0d7d76 0%,#0a5f5a 60%,#096560 100%);
  --grad-accent:linear-gradient(135deg,#7c3aed 0%,#5b21b6 100%);
  --grad-gold:linear-gradient(135deg,#f59e0b 0%,#b45309 100%);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  background:
    radial-gradient(1200px 600px at 100% -10%, rgba(13,125,118,.10), transparent 60%),
    radial-gradient(900px 500px at -10% 100%, rgba(124,58,237,.07), transparent 55%),
    var(--bg);
  color:var(--ink);line-height:1.55;font-size:15px;min-height:100vh}
a{color:var(--brand-600);text-decoration:none}
a:hover{text-decoration:underline}
button{font-family:inherit;font-size:14px;cursor:pointer}
h1,h2,h3,h4{color:var(--ink);margin:0 0 .5rem;line-height:1.25;letter-spacing:-.01em}
h1{font-size:1.7rem}h2{font-size:1.3rem}h3{font-size:1.1rem}h4{font-size:1rem}
p{margin:0 0 .75rem}
.small{font-size:.85rem;color:var(--muted)}
.hidden{display:none !important}
.flex-row{display:flex;gap:.5rem;flex-wrap:wrap;align-items:center}
.space-between{display:flex;justify-content:space-between;align-items:center;gap:.75rem;flex-wrap:wrap}
.mt-1{margin-top:.5rem}.mt-2{margin-top:1rem}.mt-3{margin-top:1.5rem}
.mb-0{margin-bottom:0}.mb-1{margin-bottom:.5rem}.mb-2{margin-bottom:1rem}

.topbar{position:sticky;top:0;z-index:100;background:var(--grad);color:#fff;
  padding:.8rem 1.25rem;display:flex;align-items:center;justify-content:space-between;
  gap:1rem;box-shadow:0 4px 20px rgba(9,101,96,.28)}
.brand{font-weight:800;font-size:1.08rem;letter-spacing:.01em;display:flex;align-items:center;gap:.55rem}
.brand-logo{width:32px;height:32px;border-radius:9px;background:rgba(255,255,255,.2);
  display:grid;place-items:center;font-size:1rem}
.topbar-right{display:flex;align-items:center;gap:.55rem;flex-wrap:wrap}
.badge{display:inline-flex;align-items:center;gap:.3rem;padding:.22rem .65rem;
  border-radius:999px;font-size:.72rem;font-weight:700;letter-spacing:.03em;
  background:rgba(255,255,255,.18);color:#fff}
.badge.ok{background:#16a34a}.badge.warn{background:#d97706}.badge.bad{background:#dc2626}
.badge .dot{width:7px;height:7px;border-radius:50%;background:currentColor;box-shadow:0 0 0 3px rgba(255,255,255,.25)}
.btn-ghost{background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.25);
  color:#fff;padding:.38rem .85rem;border-radius:9px;font-weight:600;transition:background .15s}
.btn-ghost:hover{background:rgba(255,255,255,.26)}

.mainnav{background:var(--card);border-bottom:1px solid var(--line);
  padding:.4rem 1.25rem;display:flex;gap:.25rem;overflow-x:auto;
  position:sticky;top:57px;z-index:90}
.mainnav button{background:transparent;border:1px solid transparent;border-radius:9px;
  padding:.52rem .95rem;font-weight:600;color:var(--ink-soft);white-space:nowrap;transition:all .15s}
.mainnav button.active{background:var(--brand-50);color:var(--brand-700);border-color:var(--brand-100)}
.mainnav button:hover{background:var(--line-soft)}

main#app{max-width:1180px;margin:1.35rem auto;padding:0 1.25rem;animation:fadeUp .35s ease}
@keyframes fadeUp{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@keyframes pop{from{opacity:0;transform:scale(.96)}to{opacity:1;transform:scale(1)}}

.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
  padding:1.35rem;margin-bottom:1rem;box-shadow:var(--shadow)}
.card-hero{background:linear-gradient(135deg,#fff 0%,#f6fbfb 100%);border:1px solid var(--brand-100)}
.grid{display:grid;gap:1rem;grid-template-columns:repeat(auto-fill,minmax(270px,1fr))}
.stat-grid{display:grid;gap:.85rem;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));margin-bottom:1.25rem}
.stat{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
  padding:1rem 1.1rem;box-shadow:var(--shadow);transition:transform .15s,box-shadow .15s}
.stat:hover{transform:translateY(-2px);box-shadow:var(--shadow-lg)}
.stat .stat-label{font-size:.76rem;text-transform:uppercase;letter-spacing:.06em;
  color:var(--muted);font-weight:700}
.stat .stat-value{font-size:1.65rem;font-weight:800;color:var(--brand-700);margin-top:.15rem;line-height:1.1}
.stat .stat-sub{font-size:.78rem;color:var(--muted);margin-top:.15rem}

.mod-card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
  padding:0;overflow:hidden;cursor:pointer;transition:transform .18s,box-shadow .18s,border-color .18s;
  position:relative;box-shadow:var(--shadow);display:flex;flex-direction:column}
.mod-card:hover{transform:translateY(-3px);border-color:var(--brand-200);box-shadow:var(--shadow-lg)}
.mod-accent{height:5px;background:var(--grad)}
.mod-body{padding:1.1rem 1.15rem 1.25rem;flex:1;display:flex;flex-direction:column}
.mod-num{display:inline-block;background:var(--brand-50);color:var(--brand-700);
  padding:.18rem .6rem;border-radius:7px;font-weight:800;font-size:.75rem;
  margin-bottom:.5rem;width:fit-content}
.mod-card h3{margin:.25rem 0 .4rem;font-size:1.02rem}
.mod-card p{color:var(--muted);font-size:.87rem;margin:0 0 .75rem;flex:1}
.mod-meta{display:flex;gap:.75rem;font-size:.76rem;color:var(--muted);
  padding-top:.65rem;border-top:1px dashed var(--line-soft)}
.mod-meta span{display:inline-flex;align-items:center;gap:.3rem}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:.4rem;
  padding:.62rem 1.15rem;border:1px solid transparent;border-radius:9px;font-weight:700;
  background:#e6eef0;color:var(--ink);transition:all .15s;white-space:nowrap}
.btn:hover{background:#d8e3e6}
.btn.primary{background:var(--grad);color:#fff;box-shadow:0 4px 14px rgba(13,125,118,.28)}
.btn.primary:hover{filter:brightness(1.06);box-shadow:0 6px 18px rgba(13,125,118,.36)}
.btn.accent{background:var(--grad-accent);color:#fff}
.btn.gold{background:var(--grad-gold);color:#fff}
.btn.danger{background:#dc2626;color:#fff}
.btn.danger:hover{background:#b91c1c}
.btn.ghost{background:transparent;border-color:var(--line);color:var(--ink-soft)}
.btn.ghost:hover{background:var(--line-soft);border-color:var(--brand-200)}
.btn:disabled{opacity:.55;cursor:not-allowed;filter:grayscale(.3)}
.btn-sm{padding:.36rem .72rem;font-size:.82rem;border-radius:7px}
.btn-block{display:block;width:100%}

label{display:block;margin-bottom:.95rem;font-weight:600;font-size:.88rem;color:var(--ink-soft)}
input,textarea,select{display:block;width:100%;margin-top:.35rem;padding:.7rem .8rem;
  border:1.5px solid var(--line);border-radius:9px;font-size:1rem;font-family:inherit;
  background:#fff;color:var(--ink);transition:border-color .15s,box-shadow .15s}
input:focus,textarea:focus,select:focus{outline:none;border-color:var(--brand);box-shadow:0 0 0 4px rgba(13,125,118,.12)}
textarea{resize:vertical;min-height:90px}
.link-row{display:flex;justify-content:space-between;font-size:.86rem;margin-top:.35rem}

.auth-wrap{min-height:calc(100vh - 200px);display:grid;place-items:center;padding:1rem}
.auth-card{background:var(--card);border:1px solid var(--line);border-radius:18px;
  padding:2rem 2rem 1.75rem;max-width:460px;width:100%;box-shadow:var(--shadow-lg);
  animation:pop .4s ease;position:relative;overflow:hidden}
.auth-card::before{content:'';position:absolute;inset:0 0 auto 0;height:5px;background:var(--grad)}
.auth-icon{width:56px;height:56px;border-radius:14px;background:var(--brand-50);color:var(--brand-700);
  display:grid;place-items:center;font-size:1.5rem;margin-bottom:1rem}
.auth-toggle{display:flex;gap:.25rem;background:var(--line-soft);padding:.3rem;
  border-radius:10px;margin-bottom:1.35rem}
.auth-toggle button{flex:1;padding:.55rem;border:none;background:transparent;border-radius:7px;
  font-weight:700;color:var(--muted);transition:all .15s}
.auth-toggle button.active{background:var(--card);color:var(--brand-700);box-shadow:0 1px 3px rgba(0,0,0,.08)}
.form-title{margin-bottom:1.2rem}
.form-title h1{font-size:1.55rem;margin-bottom:.3rem}
.form-title p{color:var(--muted);margin:0}

.msg{padding:.78rem 1rem;border-radius:9px;margin-bottom:.85rem;font-size:.92rem;
  display:flex;gap:.5rem;align-items:flex-start}
.msg.ok{background:var(--ok-50);color:var(--ok);border:1px solid #86efac}
.msg.bad{background:var(--bad-50);color:var(--bad);border:1px solid #fca5a5}
.msg.warn{background:var(--warn-50);color:var(--warn);border:1px solid #fbbf24}
.msg.info{background:var(--brand-50);color:var(--brand-700);border:1px solid var(--brand-100)}

.lesson-wrap{display:flex;gap:1.1rem;align-items:flex-start}
.lesson-nav{flex:0 0 265px;position:sticky;top:120px;align-self:flex-start;
  max-height:calc(100vh - 140px);overflow-y:auto;background:var(--card);
  border:1px solid var(--line);border-radius:var(--radius);padding:.85rem;box-shadow:var(--shadow)}
.lesson-nav h4{font-size:.75rem;text-transform:uppercase;letter-spacing:.08em;
  color:var(--muted);margin:.5rem 0 .45rem;padding-left:.35rem}
.lesson-nav a{display:flex;align-items:center;gap:.5rem;padding:.55rem .65rem;border-radius:8px;
  color:var(--ink-soft);font-size:.88rem;margin-bottom:.12rem;cursor:pointer;transition:all .12s}
.lesson-nav a:hover{background:var(--line-soft)}
.lesson-nav a.active{background:var(--brand-50);color:var(--brand-700);font-weight:700}
.lesson-nav .nav-num{width:22px;height:22px;border-radius:6px;background:var(--line-soft);
  display:grid;place-items:center;font-size:.72rem;font-weight:800;color:var(--muted);flex-shrink:0}
.lesson-nav a.active .nav-num{background:var(--brand);color:#fff}
.lesson-main{flex:1;min-width:0;background:var(--card);border:1px solid var(--line);
  border-radius:var(--radius);padding:1.75rem;box-shadow:var(--shadow)}
.lesson-main .lesson-lead{font-size:1.08rem;color:var(--ink-soft);line-height:1.65}
.lesson-main h3.lesson-h{color:var(--brand-700);margin-top:1.6rem;padding-bottom:.35rem;
  border-bottom:2px solid var(--brand-50)}
.lesson-callout{padding:.95rem 1.15rem;border-left:4px solid var(--brand);background:var(--brand-50);
  border-radius:8px;margin:1.1rem 0}
.lesson-callout.warn{background:var(--warn-50);border-color:var(--warn)}
.lesson-callout.danger{background:var(--bad-50);border-color:var(--bad)}
.lesson-cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));
  gap:.85rem;margin:1.1rem 0}
.lesson-card{background:linear-gradient(160deg,#f6fbfb 0%,#eef7f6 100%);
  border:1px solid var(--brand-100);border-radius:10px;padding:.95rem}
.lesson-card .card-num{display:inline-block;background:var(--brand);color:#fff;
  width:26px;height:26px;text-align:center;border-radius:50%;font-weight:800;font-size:.78rem;
  line-height:26px;margin-bottom:.45rem}
.lesson-discuss{background:linear-gradient(160deg,#faf7ff 0%,#f3eefe 100%);
  border:1px solid #ddd0fb;border-radius:10px;padding:1.05rem;margin:1.35rem 0}
.lesson-discuss h4{color:var(--accent);display:flex;align-items:center;gap:.4rem}
.discuss-prompt{color:var(--ink-soft);margin:.35rem 0 .65rem}
.note-status{font-size:.78rem;color:var(--muted);margin-top:.35rem;min-height:1.1rem;transition:color .2s}
.note-status.ok{color:var(--ok);font-weight:600}.note-status.bad{color:var(--bad);font-weight:600}
.lesson-actions{display:flex;justify-content:space-between;align-items:center;gap:.75rem;
  margin-top:1.75rem;padding-top:1.1rem;border-top:1px solid var(--line);flex-wrap:wrap}

/* Calculation widgets inside lesson content */
.calc-widget,[data-calc-widget]{
  background:linear-gradient(160deg,#fffbeb 0%,#fef3c7 100%);
  border:1px solid #fcd34d;border-radius:10px;padding:1rem 1.15rem;margin:1rem 0}
.lesson-main input[type="number"],
.lesson-main input[type="text"].calc-input{
  display:inline-block;width:auto;min-width:130px;margin-right:.5rem;margin-top:.35rem;
  padding:.55rem .7rem;font-size:1rem}
.lesson-main .calc-feedback{display:inline-block;margin-left:.5rem;font-weight:700;
  font-size:.9rem;vertical-align:middle}
.lesson-main .calc-feedback.ok{color:var(--ok)}
.lesson-main .calc-feedback.bad{color:var(--bad)}
.lesson-main .calc-feedback.warn{color:var(--warn)}
.lesson-main input.calc-ok{border-color:var(--ok);box-shadow:0 0 0 4px rgba(22,101,52,.12)}
.lesson-main input.calc-bad{border-color:var(--bad);box-shadow:0 0 0 4px rgba(185,28,28,.12)}

.quiz-intro{background:linear-gradient(135deg,#f6fbfb 0%,#eef7f6 100%);
  border:1px solid var(--brand-100);border-radius:10px;padding:1rem 1.15rem;margin-bottom:1.25rem}
.quiz-q{margin-bottom:1.35rem;padding-bottom:1.15rem;border-bottom:1px solid var(--line-soft);position:relative}
.quiz-q:last-child{border-bottom:none}
.quiz-q .q-head{display:flex;align-items:flex-start;gap:.65rem;margin-bottom:.65rem}
.q-index{width:28px;height:28px;border-radius:8px;background:var(--brand-50);color:var(--brand-700);
  display:grid;place-items:center;font-weight:800;font-size:.82rem;flex-shrink:0}
.q-text{font-weight:600;color:var(--ink);flex:1;line-height:1.5}
.q-tag{display:inline-block;background:var(--accent-50);color:var(--accent);
  padding:.1rem .5rem;border-radius:5px;font-size:.7rem;font-weight:700;letter-spacing:.03em;
  text-transform:uppercase;margin-left:.4rem}
.q-tag.calc{background:var(--warn-50);color:var(--warn)}
.quiz-opt{display:flex;align-items:flex-start;gap:.65rem;padding:.68rem .85rem;
  border:1.5px solid var(--line);border-radius:9px;margin-bottom:.45rem;cursor:pointer;
  background:#fff;transition:all .14s;font-size:.94rem}
.quiz-opt:hover{border-color:var(--brand-200);background:var(--brand-50)}
.quiz-opt input{width:auto;margin:0;flex-shrink:0;margin-top:.2rem;accent-color:var(--brand)}
.quiz-opt.selected{border-color:var(--brand);background:var(--brand-50)}
.quiz-opt.correct{border-color:var(--ok);background:var(--ok-50)}
.quiz-opt.wrong{border-color:var(--bad);background:var(--bad-50)}
.quiz-opt.locked{cursor:default}
.quiz-opt.locked:hover{background:inherit}
.quiz-explain{background:var(--brand-50);padding:.75rem .9rem;border-radius:8px;
  margin-top:.55rem;font-size:.9rem;line-height:1.55;border-left:3px solid var(--brand)}
.quiz-explain.ok{background:var(--ok-50);color:var(--ok);border-left-color:var(--ok)}
.quiz-explain.bad{background:var(--bad-50);color:var(--bad);border-left-color:var(--bad)}
.quiz-result{padding:.85rem 1.1rem;border-radius:10px;margin-top:1rem;font-weight:700;
  display:flex;align-items:center;gap:.6rem}
.quiz-result.ok{background:var(--ok-50);color:var(--ok);border:1px solid #86efac}
.quiz-result.bad{background:var(--bad-50);color:var(--bad);border:1px solid #fca5a5}
.quiz-result.info{background:var(--brand-50);color:var(--brand-700);border:1px solid var(--brand-100)}

/* Exam UI — one question per page */
.exam-shell{max-width:920px;margin:0 auto}
.exam-header{background:var(--grad);color:#fff;border-radius:var(--radius);
  padding:1.35rem 1.5rem;margin-bottom:1.25rem;box-shadow:0 8px 24px rgba(9,101,96,.28);
  display:flex;justify-content:space-between;align-items:center;gap:1rem;flex-wrap:wrap}
.exam-header h1{color:#fff;font-size:1.3rem;margin:0}
.exam-header p{color:rgba(255,255,255,.85);margin:.2rem 0 0;font-size:.88rem}
.exam-timer{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  font-weight:800;font-size:1.35rem;padding:.55rem .95rem;border-radius:10px;
  background:rgba(255,255,255,.2);border:1px solid rgba(255,255,255,.28);
  display:flex;align-items:center;gap:.5rem}
.exam-timer.warn{background:#f59e0b;border-color:#d97706}
.exam-timer.danger{background:#dc2626;border-color:#b91c1c;animation:pulse 1.1s infinite}
@keyframes pulse{50%{opacity:.75}}
.exam-progress{background:var(--card);border:1px solid var(--line);border-radius:10px;
  padding:.85rem 1.1rem;margin-bottom:1rem;box-shadow:var(--shadow)}
.progress-bar{height:10px;border-radius:999px;background:var(--line-soft);
  overflow:hidden;margin-top:.5rem}
.progress-bar > div{height:100%;background:var(--grad);transition:width .35s ease;border-radius:999px}
.exam-nav-card{padding:.9rem 1.1rem}
.qdot-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(34px,1fr));
  gap:.35rem;margin-top:.4rem}
.qdot{width:34px;height:34px;border-radius:8px;border:1.5px solid var(--line);
  background:#fff;font-weight:700;font-size:.8rem;color:var(--ink-soft);cursor:pointer;
  transition:all .14s;display:grid;place-items:center}
.qdot:hover{border-color:var(--brand-200);background:var(--brand-50);transform:translateY(-1px)}
.qdot.answered{background:var(--brand-50);border-color:var(--brand-200);color:var(--brand-700)}
.qdot.current{background:var(--brand);color:#fff;border-color:var(--brand);
  box-shadow:0 0 0 3px rgba(13,125,118,.22)}
.qdot.answered.current{background:var(--brand-700)}
.exam-question-card{padding:1.5rem;animation:pop .22s ease}
.exam-question-card .q-text{font-size:1.05rem;line-height:1.55}
.exam-footer-nav{display:flex;justify-content:space-between;align-items:center;
  gap:.6rem;flex-wrap:wrap}
.exam-passcard{background:linear-gradient(135deg,#fff 0%,#faf7ff 100%);
  border:2px dashed var(--accent);border-radius:14px;padding:2rem;text-align:center;
  max-width:480px;margin:2rem auto}

.osce-domain-card{border:1px solid var(--line);border-radius:11px;padding:.95rem 1.1rem;
  margin-bottom:.9rem;background:linear-gradient(160deg,#fff 0%,#fafdfd 100%)}
.osce-domain-card .dom-head{display:flex;justify-content:space-between;align-items:center;
  gap:.75rem;margin-bottom:.5rem}
.osce-domain-card h4{margin:0;font-size:.95rem}
.osce-rubric-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));
  gap:.5rem;margin:.6rem 0}
.rubric-box{border:1px solid var(--line);border-radius:9px;padding:.6rem .7rem;
  background:#fff;font-size:.8rem;transition:all .15s;cursor:pointer}
.rubric-box:hover{border-color:var(--brand-200);background:var(--brand-50)}
.rubric-box.selected{border-color:var(--brand);background:var(--brand-50);
  box-shadow:0 0 0 3px rgba(13,125,118,.1)}
.rubric-box strong{display:block;margin-bottom:.2rem;color:var(--brand-700)}
.rubric-box input{width:auto;margin:0;display:inline-block;margin-right:.35rem;accent-color:var(--brand)}

.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:10px;background:var(--card)}
table.data{width:100%;border-collapse:collapse;font-size:.88rem}
table.data th,table.data td{padding:.62rem .8rem;text-align:left;
  border-bottom:1px solid var(--line-soft);vertical-align:middle}
table.data th{background:var(--line-soft);font-size:.74rem;text-transform:uppercase;
  letter-spacing:.06em;color:var(--ink-soft);font-weight:700;position:sticky;top:0}
table.data tr:hover td{background:#fafcfc}
table.data tr:last-child td{border-bottom:none}
.pill{display:inline-block;padding:.15rem .55rem;border-radius:999px;font-size:.72rem;font-weight:700}
.pill.ok{background:var(--ok-50);color:var(--ok)}
.pill.bad{background:var(--bad-50);color:var(--bad)}
.pill.warn{background:var(--warn-50);color:var(--warn)}
.pill.info{background:var(--brand-50);color:var(--brand-700)}

.tabs{display:flex;gap:.25rem;border-bottom:2px solid var(--line);margin-bottom:1.15rem;
  overflow-x:auto;padding-bottom:0}
.tab{background:transparent;border:none;padding:.62rem .95rem;font-weight:700;
  color:var(--muted);border-radius:9px 9px 0 0;white-space:nowrap;transition:all .15s;
  border-bottom:2px solid transparent;margin-bottom:-2px}

@media(max-width:760px){
  .lesson-wrap{flex-direction:column}

  .mainnav{top:auto;position:static}
  main#app{margin:.85rem auto;padding:0 .85rem}
  .exam-header{padding:1rem}
  .auth-card{padding:1.5rem}
}
</style>
</head>
<body>

<header class="topbar">
  <div class="brand">
    <span class="brand-logo">🩺</span>
    <span id="brandLabel">Neonatal Nursing LMS</span>
  </div>
  <div class="topbar-right">
    <span class="badge ok" id="netBadge"><span class="dot"></span><span>Online</span></span>
    <span class="badge warn hidden" id="pendingBadge">0 queued</span>
    <span class="small hidden" style="color:#e6f4f3" id="userName"></span>
    <button class="btn-ghost hidden" id="logoutBtn">Log out</button>
  </div>
</header>

<nav class="mainnav hidden" id="mainNav">
  <button data-nav="dashboard" class="active">📚 Learn</button>
  <button data-nav="exams">📝 Exams</button>
  <button data-nav="grades">📊 My Grades</button>
  <button data-nav="certificates">🏅 Certificates</button>
  <button data-nav="portfolio">📁 Portfolio</button>
  <button data-nav="admin" id="adminNavBtn" class="hidden">⚙️ Admin</button>
</nav>

<div id="offlineBanner" class="offline-banner hidden">⚠ You are offline — cached content &amp; queued updates active.</div>

<main id="app"></main>
<div id="modalRoot" class="hidden"></div>
<div id="toast" class="toast hidden"></div>

<script>
/* ============================================================
   CONFIG / STATE
   ============================================================ */
const CFG = window.LMS_CONFIG || {};
const API_URL = CFG.API_URL || 'https://script.google.com/macros/s/AKfycbwpJOE_nvwrOjI01sdCnHnr2uRAqbOuA54C6cKaJlV4UmZpj8qJfHg_bwydHRbULMa8Kg/exec';
const COURSE_TITLE = CFG.COURSE_TITLE || 'Neonatal Nursing';
const PASS_THRESHOLD = Number(CFG.PASS_THRESHOLD) || 80;
const EXAMS_CFG = Object.assign({
  MIDTERM_TITLE: 'Midterm Theory Examination (30 MCQs · Modules 1–3)',
  FINAL_TITLE: 'Final Comprehensive Examination (40 MCQs · Modules 1–6)',
  MIDTERM_PASSCODE: 'MIDTERM2026',
  FINAL_PASSCODE: 'FINAL2026'
}, CFG.EXAMS || {});
const OFFLINE = Object.assign({
  ENABLED: true, SERVICE_WORKER: 'sw.js', CACHE_VERSION: 'lms-v5',
  QUEUE_MAX_ITEMS: 200, QUEUE_MAX_RETRIES: 5, SYNC_BATCH_SIZE: 25,
  SYNC_INTERVAL_MS: 30000, PING_INTERVAL_MS: 60000
}, CFG.OFFLINE || {});

const Q_KEY = 'lms_queue_v5';
const S_KEY = 'lms_token_v5';
const U_KEY = 'lms_user_v5';

const state = {
  token: localStorage.getItem(S_KEY) || null,
  user: (() => { try { return JSON.parse(localStorage.getItem(U_KEY) || 'null'); } catch(e){ return null; } })(),
  modules: [],
  online: navigator.onLine,
  currentExam: null,
  examTimerHandle: null,
  busy: false
};

/* ============================================================
   UTILITIES
   ============================================================ */
const $ = sel => document.querySelector(sel);
const app = () => document.getElementById('app');

function esc(s){
  return String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;')
    .replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}
function el(html){ const d = document.createElement('div'); d.innerHTML = html.trim(); return d.firstElementChild; }
function fmtShort(d){ try { return new Date(d).toLocaleDateString(); } catch(e){ return String(d); } }

function toast(msg, kind){
  const t = document.getElementById('toast');
  t.className = 'toast ' + (kind || '');
  t.innerHTML = (kind === 'ok' ? '✓ ' : kind === 'bad' ? '✕ ' : kind === 'warn' ? '⚠ ' : 'ℹ ') + esc(msg);
  t.classList.remove('hidden');
  clearTimeout(toast._t);
  toast._t = setTimeout(() => t.classList.add('hidden'), 3800);
}
function openModal(html){
  const root = document.getElementById('modalRoot');
  root.innerHTML = `<div class="modal-backdrop"><div class="modal-card">${html}</div></div>`;
  root.classList.remove('hidden');
  root.querySelector('.modal-backdrop').addEventListener('click', e => {
    if (e.target.classList.contains('modal-backdrop')) closeModal();
  });
}
function closeModal(){
  const root = document.getElementById('modalRoot');
  root.classList.add('hidden');
  root.innerHTML = '';
}
function setBusy(b){
  state.busy = b;
  document.querySelectorAll('button.btn.primary').forEach(b2 => b2.disabled = b);
}

/* ============================================================
   OFFLINE QUEUE
   ============================================================ */
function getQueue(){ try { return JSON.parse(localStorage.getItem(Q_KEY) || '[]'); } catch(e){ return []; } }
function setQueue(q){ localStorage.setItem(Q_KEY, JSON.stringify(q)); updatePendingBadge(); }
function enqueue(item){
  const q = getQueue();
  q.push(Object.assign({ clientId: cryptoId(), attempts: 0, ts: Date.now() }, item));
  if (q.length > OFFLINE.QUEUE_MAX_ITEMS) q.splice(0, q.length - OFFLINE.QUEUE_MAX_ITEMS);
  setQueue(q);
}
function cryptoId(){ return 'q_' + Date.now().toString(36) + Math.random().toString(36).slice(2, 8); }
function updatePendingBadge(){
  const b = document.getElementById('pendingBadge');
  if (!b) return;
  const n = getQueue().length;
  if (n > 0) { b.textContent = n + ' queued'; b.classList.remove('hidden'); }
  else b.classList.add('hidden');
}
async function flushQueue(){
  const q = getQueue();
  if (!q.length || !state.online || !state.token) return;
  const batch = q.slice(0, OFFLINE.SYNC_BATCH_SIZE);
  try {
    const res = await fetch(API_URL, {
      method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify({ action: 'syncBatch', token: state.token,
        items: batch.map(x => ({ clientId: x.clientId, action: x.action, body: x.body })) })
    });
    const j = await res.json();
    if (!j.ok) return;
    const okIds = new Set((j.data.results || []).filter(r => r.ok).map(r => r.clientId));
    const remaining = q.filter(x => !okIds.has(x.clientId)).map(x => {
      if (batch.some(b => b.clientId === x.clientId)) x.attempts = (x.attempts || 0) + 1;
      return x;
    }).filter(x => (x.attempts || 0) < OFFLINE.QUEUE_MAX_RETRIES);
    setQueue(remaining);
    if (okIds.size) toast(`Synced ${okIds.size} offline change(s)`, 'ok');
  } catch(e){ /* silent */ }
}

/* ============================================================
   API CLIENT
   ============================================================ */
async function api(action, body, opts){
  opts = opts || {};
  const payload = Object.assign({}, body || {}, { action, token: state.token });
  if (!state.online && opts.allowQueue !== false &&
      !['login','register','forgot','reset','ping'].includes(action)) {
    enqueue({ action, body: body || {} });
    return { ok: true, data: { queued: true }, queued: true };
  }
  try {
    const res = await fetch(API_URL, {
      method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify(payload)
    });
    const text = await res.text();
    let j;
    try { j = JSON.parse(text); } catch(e){ throw new Error('Invalid server response'); }
    if (!j.ok && j.code === 401) {
      clearSession(); renderAuth();
      toast('Session expired — please log in again', 'warn');
    }
    return j;
  } catch(err){
    if (!state.online && opts.allowQueue !== false) {
      enqueue({ action, body: body || {} });
      return { ok: true, data: { queued: true }, queued: true };
    }
    throw err;
  }
}

/* ============================================================
   SESSION
   ============================================================ */
function saveSession(token, user){
  state.token = token; state.user = user;
  localStorage.setItem(S_KEY, token);
  localStorage.setItem(U_KEY, JSON.stringify(user));
  refreshHeader();
}
function clearSession(){
  state.token = null; state.user = null;
  localStorage.removeItem(S_KEY);
  localStorage.removeItem(U_KEY);
  refreshHeader();
}
function refreshHeader(){
  const nav = document.getElementById('mainNav');
  const logBtn = document.getElementById('logoutBtn');
  const uname = document.getElementById('userName');
  const adminBtn = document.getElementById('adminNavBtn');
  if (state.token && state.user) {
    nav.classList.remove('hidden');
    logBtn.classList.remove('hidden');
    uname.classList.remove('hidden');
    uname.textContent = state.user.name + ' · ' + state.user.role;
    if (state.user.role === 'admin' || state.user.role === 'instructor') adminBtn.classList.remove('hidden');
    else adminBtn.classList.add('hidden');
  } else {
    nav.classList.add('hidden');
    logBtn.classList.add('hidden');
    uname.classList.add('hidden');
    adminBtn.classList.add('hidden');
  }
}

/* ============================================================
   AUTH
   ============================================================ */
function renderAuth(mode){
  mode = mode || 'login';
  app().innerHTML = `
  <div class="auth-wrap">
    <div class="auth-card">
      <div class="auth-icon">${mode === 'register' ? '✨' : mode === 'forgot' ? '🔑' : mode === 'reset' ? '🛡️' : '🩺'}</div>
      <div class="form-title">
        <h1>${mode === 'register' ? 'Create account' : mode === 'forgot' ? 'Reset password' : mode === 'reset' ? 'Set new password' : 'Welcome back'}</h1>
        <p>${esc(COURSE_TITLE)} · Learning Management System</p>
      </div>
      ${mode === 'login' || mode === 'register' ? `
        <div class="auth-toggle">
          <button data-auth="login" class="${mode === 'login' ? 'active' : ''}">Log in</button>
          <button data-auth="register" class="${mode === 'register' ? 'active' : ''}">Register</button>
        </div>` : ''}
      <div id="authMsg"></div>
      ${mode === 'forgot' ? `
        <form id="authForm">
          <label>Email address<input type="email" name="email" required placeholder="you@example.com"></label>
          <button class="btn primary btn-block" type="submit">Send reset code</button>
          <div class="link-row"><span></span><a href="#" data-auth="login">Back to login</a></div>
        </form>` : mode === 'reset' ? `
        <form id="authForm">
          <label>Email address<input type="email" name="email" required></label>
          <label>Reset code<input type="text" name="code" required placeholder="6-digit code"></label>
          <label>New password<input type="password" name="password" required minlength="8"></label>
          <button class="btn primary btn-block" type="submit">Update password</button>
          <div class="link-row"><span></span><a href="#" data-auth="login">Back to login</a></div>
        </form>` : `
        <form id="authForm">
          ${mode === 'register' ? '<label>Full name<input name="name" required></label>' : ''}
          <label>Email address<input type="email" name="email" required></label>
          <label>Password<input type="password" name="password" required minlength="8"></label>
          ${mode === 'register' ? '<label>Role<select name="role"><option value="learner">Learner</option><option value="instructor">Instructor</option><option value="admin">Administrator</option></select></label>' : ''}
          <button class="btn primary btn-block" type="submit">${mode === 'register' ? 'Create account' : 'Log in'}</button>
          ${mode === 'login' ? '<div class="link-row"><a href="#" data-auth="forgot">Forgot password?</a><span></span></div>' : ''}
        </form>`}
    </div>
  </div>`;

  document.querySelectorAll('[data-auth]').forEach(b => {
    b.addEventListener('click', e => {
      if (b.tagName === 'A') e.preventDefault();
      renderAuth(b.getAttribute('data-auth'));
    });
  });

  const form = document.getElementById('authForm');
  if (form) form.addEventListener('submit', async ev => {
    ev.preventDefault();
    const data = Object.fromEntries(new FormData(form).entries());
    const msg = document.getElementById('authMsg');
    msg.innerHTML = '';
    try {
      if (mode === 'login') {
        const r = await api('login', { email: data.email, password: data.password }, { allowQueue: false });
        if (!r.ok) { msg.innerHTML = `<div class="msg bad">${esc(r.error)}</div>`; return; }
        saveSession(r.data.token, r.data.user);
        toast('Welcome back, ' + r.data.user.name, 'ok');
        route('dashboard');
      } else if (mode === 'register') {
        const r = await api('register', data, { allowQueue: false });
        if (!r.ok) { msg.innerHTML = `<div class="msg bad">${esc(r.error)}</div>`; return; }
        msg.innerHTML = `<div class="msg ok">Account created. ${data.role === 'learner' ? 'You can now log in.' : 'Awaiting administrator approval.'}</div>`;
        setTimeout(() => renderAuth('login'), 1400);
      } else if (mode === 'forgot') {
        const r = await api('forgot', { email: data.email }, { allowQueue: false });
        if (!r.ok) { msg.innerHTML = `<div class="msg bad">${esc(r.error)}</div>`; return; }
        msg.innerHTML = `<div class="msg info">${esc(r.data.message)}${r.data.code ? '<br><br><strong>Reset code: ' + esc(r.data.code) + '</strong>' : ''}</div>`;
      } else if (mode === 'reset') {
        const r = await api('reset', data, { allowQueue: false });
        if (!r.ok) { msg.innerHTML = `<div class="msg bad">${esc(r.error)}</div>`; return; }
        msg.innerHTML = `<div class="msg ok">Password updated. Redirecting…</div>`;
        setTimeout(() => renderAuth('login'), 1200);
      }
    } catch(err) {
      msg.innerHTML = `<div class="msg bad">${esc(err.message)}</div>`;
    }
  });
}

/* ============================================================
   DASHBOARD
   ============================================================ */
async function renderDashboard(){
  app().innerHTML = `<div class="card"><div class="flex-row" style="justify-content:center;padding:2rem 0;">
    <span class="small">Loading modules…</span></div></div>`;
  try {
    const r = await api('listContent', {});
    if (!r.ok) throw new Error(r.error);
    state.modules = r.data.modules || [];
  } catch(e){
    app().innerHTML = `<div class="msg bad">Failed to load content: ${esc(e.message)}</div>`;
    return;
  }
  const totalLessons = state.modules.reduce((s, m) => s + (m.Lessons || []).length, 0);
  const totalQuizzes = state.modules.reduce((s, m) => s + (m.Quizzes || []).length, 0);

  app().innerHTML = `
    <div class="card card-hero">
      <div class="space-between">
        <div>
          <h1 style="margin:0">Welcome back, ${esc(state.user?.name || 'Learner')} 👋</h1>
          <p class="small" style="margin:.35rem 0 0">${esc(COURSE_TITLE)} · Continue your clinical learning journey</p>
        </div>
        <button class="btn primary" onclick="route('exams')">Take an exam →</button>
      </div>
    </div>
    <div class="stat-grid">
      <div class="stat"><div class="stat-label">Modules</div><div class="stat-value">${state.modules.length}</div><div class="stat-sub">Available</div></div>
      <div class="stat"><div class="stat-label">Lessons</div><div class="stat-value">${totalLessons}</div><div class="stat-sub">Across all modules</div></div>
      <div class="stat"><div class="stat-label">Quiz items</div><div class="stat-value">${totalQuizzes}</div><div class="stat-sub">Practice questions</div></div>
      <div class="stat"><div class="stat-label">Pass mark</div><div class="stat-value">${PASS_THRESHOLD}%</div><div class="stat-sub">OSCE threshold</div></div>
    </div>
    <h2 style="margin:1.25rem 0 .75rem">📚 Course modules</h2>
    <div class="grid" id="modGrid"></div>`;

  const grid = document.getElementById('modGrid');
  state.modules.forEach((m, i) => {
    const nLessons = (m.Lessons || []).length;
    const nQuizzes = (m.Quizzes || []).length;
    const card = el(`
      <div class="mod-card">
        <div class="mod-accent"></div>
        <div class="mod-body">
          <span class="mod-num">Module ${i}</span>
          <h3>${esc(m.Title)}</h3>
          <p>${esc(m.Description || '')}</p>
          <div class="mod-meta">
            <span>📄 ${nLessons} lesson${nLessons===1?'':'s'}</span>
            <span>❓ ${nQuizzes} question${nQuizzes===1?'':'s'}</span>
          </div>
        </div>
      </div>`);
    card.addEventListener('click', () => route('module', { moduleId: m.ModuleID }));
    grid.appendChild(card);
  });
}

/* ============================================================
   MODULE / LESSON
   ============================================================ */
function renderModule(params){
  const m = state.modules.find(x => x.ModuleID === params.moduleId);
  if (!m) { route('dashboard'); return; }
  const lessonId = params.lessonId || (m.Lessons[0] && m.Lessons[0].LessonID);
  renderLesson(m, lessonId);
}

function renderLesson(m, lessonId){
  const lesson = (m.Lessons || []).find(l => l.LessonID === lessonId);
  if (!lesson) { renderLessonListOnly(m); return; }

  app().innerHTML = `
    <div class="flex-row" style="margin-bottom:.9rem;justify-content:space-between">
      <button class="btn ghost btn-sm" onclick="route('dashboard')">← All modules</button>
      <button class="btn accent btn-sm" onclick="startQuizGroup('${esc(m.ModuleID)}')">📝 Module quiz (${(m.Quizzes||[]).length})</button>
    </div>
    <div class="lesson-wrap">
      <aside class="lesson-nav">
        <h4>${esc(m.Title)}</h4>
        ${(m.Lessons || []).map((l, idx) => `
          <a data-lesson="${esc(l.LessonID)}" class="${l.LessonID === lessonId ? 'active' : ''}">
            <span class="nav-num">${idx+1}</span><span>${esc(l.Title)}</span>
          </a>`).join('')}
      </aside>
      <article class="lesson-main" id="lessonMain"></article>
    </div>`;

  document.querySelectorAll('[data-lesson]').forEach(a => {
    a.addEventListener('click', () => route('module', { moduleId: m.ModuleID, lessonId: a.getAttribute('data-lesson') }));
  });

  const main = document.getElementById('lessonMain');
  main.innerHTML = `<h1>${esc(lesson.Title)}</h1>` + (lesson.ContentHTML || '<p class="small">No content.</p>');

  // Wire calculation widget Check buttons inside lesson HTML
  wireCalcCheckButtons(main);

  // Wire discussion notes autosave
  main.querySelectorAll('textarea[data-note-key]').forEach(ta => {
    const key = ta.getAttribute('data-note-key');
    const status = main.querySelector(`[data-note-status="${key}"]`);
    loadUserNote(key, ta, status);
    let debounce;
    ta.addEventListener('input', () => {
      clearTimeout(debounce);
      status.textContent = 'Saving…';
      status.className = 'note-status';
      debounce = setTimeout(async () => {
        try {
          const r = await api('saveUserData', { dataType: 'note', dataKey: key, dataValue: ta.value }, { allowQueue: true });
          if (r.ok) { status.textContent = 'Saved ✓'; status.className = 'note-status ok'; }
          else { status.textContent = 'Save failed'; status.className = 'note-status bad'; }
        } catch(e){ status.textContent = 'Queued offline'; status.className = 'note-status'; }
      }, 800);
    });
  });

  const idx = (m.Lessons || []).findIndex(l => l.LessonID === lessonId);
  const prev = idx > 0 ? m.Lessons[idx-1] : null;
  const next = idx < (m.Lessons || []).length - 1 ? m.Lessons[idx+1] : null;
  const actions = document.createElement('div');
  actions.className = 'lesson-actions';
  actions.innerHTML = `
    <button class="btn ghost" ${prev ? '' : 'disabled'} id="prevLesson">← Previous</button>
    <span class="small">Lesson ${idx+1} of ${m.Lessons.length}</span>
    <button class="btn primary" ${next ? '' : 'disabled'} id="nextLesson">Next lesson →</button>`;
  main.appendChild(actions);
  if (prev) document.getElementById('prevLesson').onclick = () => route('module', { moduleId: m.ModuleID, lessonId: prev.LessonID });
  if (next) document.getElementById('nextLesson').onclick = () => route('module', { moduleId: m.ModuleID, lessonId: next.LessonID });
}

function renderLessonListOnly(m){
  app().innerHTML = `<div class="card"><h2>${esc(m.Title)}</h2>
    <p class="small">Select a lesson below.</p>
    ${(m.Lessons || []).map((l, i) => `<div class="quiz-opt" data-l="${esc(l.LessonID)}"><strong>${i+1}.</strong> ${esc(l.Title)}</div>`).join('')}
  </div>`;
  document.querySelectorAll('[data-l]').forEach(d => d.onclick = () => route('module', { moduleId: m.ModuleID, lessonId: d.getAttribute('data-l') }));
}

/* ============================================================
   CALCULATION WIDGETS — functional Check buttons in lesson HTML
   ============================================================ */
function wireCalcCheckButtons(container){
  if (!container) return;
  container.querySelectorAll('button').forEach(btn => {
    if (btn.dataset.calcWired === '1') return;
    const txt = (btn.textContent || '').trim().toLowerCase();
    const isCheck =
      btn.hasAttribute('data-calc-check') ||
      btn.classList.contains('calc-check') ||
      txt === 'check' || txt === '✓ check' || txt === 'check answer';
    if (!isCheck) return;
    btn.dataset.calcWired = '1';

    btn.addEventListener('click', (e) => {
      e.preventDefault();
      const input = findCalcInput(btn);
      if (!input) { showCalcFeedback(btn, '⚠ No input found near this button', 'warn'); return; }
      const expected = findCalcAnswer(btn, input);
      if (!expected) {
        showCalcFeedback(btn, '⚠ No answer configured (add data-answer="…")', 'warn');
        return;
      }
      const userVal = (input.value || '').trim();
      if (!userVal) {
        showCalcFeedback(btn, '⚠ Please enter a value', 'warn');
        input.focus();
        return;
      }
      const ok = compareCalcAnswer(userVal, expected);
      if (ok) {
        showCalcFeedback(btn, '✓ Correct!', 'ok');
        input.classList.add('calc-ok'); input.classList.remove('calc-bad');
      } else {
        showCalcFeedback(btn, '✕ Incorrect — try again', 'bad');
        input.classList.add('calc-bad'); input.classList.remove('calc-ok');
      }
    });
  });
}

function findCalcInput(btn){
  // 1) within a container that has data-answer
  let parent = btn.closest('[data-answer],[data-correct],[data-expected]');
  if (parent) {
    const i = parent.querySelector('input, textarea');
    if (i) return i;
  }
  // 2) previous sibling input
  let sib = btn.previousElementSibling;
  while (sib) {
    if (sib.tagName === 'INPUT' || sib.tagName === 'TEXTAREA') return sib;
    if (sib.querySelector) {
      const i = sib.querySelector('input, textarea');
      if (i) return i;
    }
    sib = sib.previousElementSibling;
  }
  // 3) parent's querySelector
  if (btn.parentElement) {
    const i = btn.parentElement.querySelector('input, textarea');
    if (i) return i;
  }
  return null;
}

function findCalcAnswer(btn, input){
  // 1) input's own data-answer
  let a = input.dataset.answer || input.getAttribute('data-answer')
       || input.dataset.correct || input.getAttribute('data-correct')
       || input.dataset.expected || input.getAttribute('data-expected');
  if (a) return a;
  // 2) ancestors
  let anc = input.parentElement;
  while (anc) {
    if (anc.dataset) {
      a = anc.dataset.answer || anc.dataset.correct || anc.dataset.expected;
      if (a) return a;
    }
    if (anc.getAttribute) {
      a = anc.getAttribute('data-answer') || anc.getAttribute('data-correct') || anc.getAttribute('data-expected');
      if (a) return a;
    }
    anc = anc.parentElement;
  }
  // 3) sibling with class answer / correct-answer
  let s = input.nextElementSibling;
  while (s) {
    if (s.classList && (s.classList.contains('answer') || s.classList.contains('correct-answer'))) {
      return (s.textContent || '').trim();
    }
    s = s.nextElementSibling;
  }
  // 4) regex over the surrounding text (Answer: X or = X or equals X)
  let prev = input.previousElementSibling;
  while (prev) {
    const txt = prev.textContent || '';
    const m = txt.match(/(?:answer|equals|=)\s*[:=]?\s*([0-9]+(?:\.[0-9]+)?)/i);
    if (m) return m[1];
    prev = prev.previousElementSibling;
  }
  const ptxt = (input.parentElement && input.parentElement.textContent) || '';
  const pm = ptxt.match(/(?:answer|equals|=)\s*[:=]?\s*([0-9]+(?:\.[0-9]+)?)/i);
  return pm ? pm[1] : null;
}

function compareCalcAnswer(user, expected){
  const alts = String(expected).split(/[|;]/).map(s => s.trim()).filter(Boolean);
  return alts.some(alt => {
    const uNum = parseFloat(String(user).replace(/[^0-9.\-]/g, ''));
    const eNum = parseFloat(String(alt).replace(/[^0-9.\-]/g, ''));
    if (!isNaN(uNum) && !isNaN(eNum)) {
      const tol = Math.max(Math.abs(eNum) * 0.005, 0.01);
      return Math.abs(uNum - eNum) <= tol;
    }
    return String(user).toLowerCase().trim() === alt.toLowerCase().trim();
  });
}

function showCalcFeedback(btn, msg, kind){
  let fb = btn.nextElementSibling;
  if (!fb || !fb.classList.contains('calc-feedback')) {
    fb = document.createElement('span');
    fb.className = 'calc-feedback';
    btn.parentNode.insertBefore(fb, btn.nextSibling);
  }
  fb.className = 'calc-feedback ' + (kind || '');
  fb.textContent = ' ' + msg;
}

  app().innerHTML = `

        </p>
      </div>
      <div id="quizQuestions"></div>
      <div id="quizResultBox"></div>
      <div class="mt-2 flex-row" style="justify-content:space-between">

          <span class="q-index">${i+1}</span>

            <label class="quiz-opt" data-opt="${j}">

      </div>`);
    container.appendChild(card);

    card.querySelectorAll(`input[name="q_${CSS.escape(q.QuizID)}"]`).forEach(r => {

      box.innerHTML = `<div class="quiz-result ${pass ? 'ok' : 'info'}">

async function startExam(type){
  const title = type === 'final' ? EXAMS_CFG.FINAL_TITLE : EXAMS_CFG.MIDTERM_TITLE;
  const hint  = type === 'final' ? EXAMS_CFG.FINAL_PASSCODE : EXAMS_CFG.MIDTERM_PASSCODE;
  openModal(`
    <div class="modal-head">
      <h3>${esc(title)}</h3>
      <button class="modal-close" onclick="closeModal()">×</button>
    </div>
    <div class="msg info">Enter the exam passcode to unlock the paper. Contact your instructor if you don't have one.</div>
    <label>Exam passcode
      <input type="text" id="examPass" placeholder="e.g. ${esc(hint)}">
    </label>
    <div class="flex-row" style="justify-content:flex-end;gap:.5rem">
      <button class="btn ghost" onclick="closeModal()">Cancel</button>
      <button class="btn primary" id="unlockExam">Unlock &amp; begin</button>
    </div>`);

  document.getElementById('unlockExam').addEventListener('click', async () => {
    const pass = document.getElementById('examPass').value.trim();
    if (!pass) { toast('Enter the passcode', 'warn'); return; }
    setBusy(true);
    try {
      const r = await api('verifyExamPasscode', { examType: type, passcode: pass });
      if (!r.ok) { toast(r.error || 'Invalid passcode', 'bad'); return; }
      closeModal();
      beginExam(type, r.data.questions, pass);
    } catch(e){ toast('Error: ' + e.message, 'bad'); }
    finally { setBusy(false); }
  });
}

function beginExam(type, questions, passcode){
  if (!questions || !questions.length) { toast('No exam questions configured', 'bad'); return; }
  state.currentExam = {
    type, questions, passcode,
    startedAt: Date.now(),
    answers: {},
    currentIndex: 0,
    submitted: false
  };
  renderExamUI();
}

function renderExamUI(){
  const ex = state.currentExam;
  if (!ex) { route('exams'); return; }
  const title = ex.type === 'final' ? EXAMS_CFG.FINAL_TITLE : EXAMS_CFG.MIDTERM_TITLE;
  const total = ex.questions.length;

  app().innerHTML = `
    <div class="exam-shell">
      <div class="exam-header">
        <div>
          <h1>${esc(title)}</h1>
          <p>${total} questions · one per page · answer all then submit</p>
        </div>
        <div class="exam-timer" id="examTimer">00:00</div>
      </div>

      <div class="exam-progress">
        <div class="space-between small">
          <span id="examQNum">Question 1 of ${total}</span>
          <span><strong id="answeredCount">0</strong> / ${total} answered</span>
        </div>
        <div class="progress-bar"><div id="examProgressBar" style="width:0%"></div></div>
      </div>

      <div class="card exam-nav-card">

    </div>`;

  renderExamQuestion();

  document.getElementById('prevBtn').addEventListener('click', () => {
    if (ex.currentIndex > 0) { ex.currentIndex--; renderExamQuestion(); updateExamNav(); }
  });
  document.getElementById('nextBtn').addEventListener('click', () => {
    if (ex.currentIndex < total - 1) { ex.currentIndex++; renderExamQuestion(); updateExamNav(); }
  });
  document.getElementById('submitExamBtn').addEventListener('click', () => submitExamUI(true));
  document.getElementById('qNavDots').addEventListener('click', (e) => {
    const b = e.target.closest('[data-qidx]');
    if (!b) return;
    ex.currentIndex = Number(b.getAttribute('data-qidx'));
    renderExamQuestion();
    updateExamNav();
  });
}

function renderExamQuestion(){
  const ex = state.currentExam;
  const idx = ex.currentIndex;
  const q = ex.questions[idx];
  const chosen = ex.answers[q.QuestionID];
  const options = ['A','B','C','D'];
  const container = document.getElementById('examQuestionContainer');
  container.innerHTML = `
    <div class="card exam-question-card">
      <div class="q-head">
        <span class="q-index">${idx + 1}</span>
        <div class="q-text">${esc(q.Question)}${q.ModuleTag ? ` <span class="q-tag">${esc(q.ModuleTag)}</span>` : ''}</div>
      </div>
      <div class="q-opts">
        ${options.map((L, j) => {
          const sel = chosen === j ? 'selected' : '';
          const chk = chosen === j ? 'checked' : '';
          return `<label class="quiz-opt ${sel}" data-opt="${j}">
            <input type="radio" name="exam_opt_${idx}" value="${j}" ${chk}>
            <span><strong>${L}.</strong> ${esc(q['Option' + L] || '')}</span>
          </label>`;
        }).join('')}
      </div>
    </div>`;

  container.querySelectorAll(`input[name="exam_opt_${idx}"]`).forEach(r => {
    r.addEventListener('change', () => {
      ex.answers[q.QuestionID] = Number(r.value);
      container.querySelectorAll('.quiz-opt').forEach(o => o.classList.remove('selected'));
      r.closest('.quiz-opt').classList.add('selected');
      updateExamNav();
    });
  });
}

function updateExamNav(){
  const ex = state.currentExam;
  if (!ex) return;
  const idx = ex.currentIndex;
  const total = ex.questions.length;
  const answered = Object.keys(ex.answers).length;

  const qn = document.getElementById('examQNum');
  const qi = document.getElementById('examQIndicator');
  const ac = document.getElementById('answeredCount');
  const pb = document.getElementById('examProgressBar');
  const prevBtn = document.getElementById('prevBtn');
  const nextBtn = document.getElementById('nextBtn');

  if (qn) qn.textContent = `Question ${idx + 1} of ${total}`;
  if (qi) qi.textContent = `Question ${idx + 1} of ${total}`;
  if (ac) ac.textContent = answered;
  if (pb) pb.style.width = Math.round(((idx + 1) / total) * 100) + '%';
  if (prevBtn) prevBtn.disabled = idx === 0;
  if (nextBtn) nextBtn.disabled = idx === total - 1;

  const nav = document.getElementById('qNavDots');
  if (nav) {
    nav.innerHTML = ex.questions.map((q, i) => {
      const isAnswered = ex.answers[q.QuestionID] !== undefined;
      const isCurrent = i === idx;
      let cls = 'qdot';
      if (isAnswered) cls += ' answered';
      if (isCurrent) cls += ' current';
      return `<button class="${cls}" data-qidx="${i}" title="Question ${i+1}${isAnswered ? ' (answered)' : ''}">${i + 1}</button>`;
    }).join('');
  }
}

function startExamTimer(){
  stopExamTimer();
  state.examTimerHandle = setInterval(() => {
    const ex = state.currentExam;
    if (!ex) return;
    const seconds = Math.floor((Date.now() - ex.startedAt) / 1000);
    const mm = String(Math.floor(seconds/60)).padStart(2,'0');
    const ss = String(seconds % 60).padStart(2,'0');
    const t = document.getElementById('examTimer');
    if (!t) return;
    t.textContent = `${mm}:${ss}`;
    t.classList.remove('warn','danger');
    if (seconds >= 45*60) t.classList.add('danger');
    else if (seconds >= 30*60) t.classList.add('warn');
  }, 1000);
}
function stopExamTimer(){
  if (state.examTimerHandle) { clearInterval(state.examTimerHandle); state.examTimerHandle = null; }
}
function cancelExam(){
  if (!confirm('Cancel this exam? Your answers will be discarded.')) return;
  stopExamTimer();
  state.currentExam = null;
  route('exams');
}

async function submitExamUI(confirmPrompt){
  const ex = state.currentExam;
  if (!ex) return;
  const answered = Object.keys(ex.answers).length;
  const total = ex.questions.length;
  if (answered < total) {
    if (!confirm(`You have answered ${answered} of ${total} questions. Submit anyway?`)) return;
  } else if (confirmPrompt !== false) {
    if (!confirm('Submit your exam now? You cannot change answers afterwards.')) return;
  }
  const answers = ex.questions.map(q => ({
    questionId: q.QuestionID,
    chosenIndex: ex.answers[q.QuestionID] !== undefined ? ex.answers[q.QuestionID] : -1
  }));
  const btn = document.getElementById('submitExamBtn');
  if (btn) { btn.disabled = true; btn.textContent = 'Submitting…'; }
  try {
    const r = await api('submitExam', { examType: ex.type, passcode: ex.passcode, answers });
    if (!r.ok) {
      toast(r.error || 'Submit failed', 'bad');
      if (btn) { btn.disabled = false; btn.textContent = 'Submit exam'; }
      return;
    }
    if (r.data.queued) {
      stopExamTimer();
      state.currentExam = null;
      toast('Exam saved offline — will sync when online', 'warn');
      route('exams');
      return;
    }
    ex.submitted = true;
    stopExamTimer();
    renderExamResults(r.data);
  } catch(e){
    toast('Submit error: ' + e.message, 'bad');
    if (btn) { btn.disabled = false; btn.textContent = 'Submit exam'; }
  }
}

          <strong>${r.correct ? '✓ You got it right' : '✕ You selected ' + (r.chosenIndex >= 0 ? options[r.chosenIndex] : '—') + ' — correct answer is ' + options[r.correctIndex]}</strong><br>

        </div>
      </div>`);
    review.appendChild(card);
  });
}

async function renderPortfolio(){
  app().innerHTML = `<div class="card"><div class="flex-row" style="justify-content:center;padding:2rem 0;">
    <span class="small">Loading portfolio…</span></div></div>`;
  let subs = [];
  try {
    const r = await api('listMyPortfolio', {});
    if (r.ok) subs = r.data.submissions || [];
  } catch(e){ /* offline */ }

  app().innerHTML = `
    <div class="card card-hero">
      <h1 style="margin:0">📁 Reflective Portfolio</h1>
      <p class="small" style="margin:.35rem 0 0">Upload reflective documents (PDF, DOC, DOCX, JPG, PNG) up to 10 MB. Files are stored securely in Google Drive.</p>
    </div>
    <div class="card">
      <h3>Upload new submission</h3>
      <form id="portfolioForm">
        <label>Module
          <select name="moduleId" required>
            <option value="">Select module…</option>
            ${state.modules.map(m => `<option value="${esc(m.ModuleID)}">${esc(m.Title)}</option>`).join('')}
          </select>
        </label>
        <label>File (max 10 MB)<input type="file" name="file" required accept=".pdf,.doc,.docx,.jpg,.jpeg,.png"></label>
        <button class="btn primary" type="submit">Upload portfolio</button>
      </form>
    </div>
    <div class="card">
      <h3>My submissions</h3>
      ${subs.length ? `
        <div class="tbl-wrap"><table class="data">
          <thead><tr><th>Module</th><th>File</th><th>Status</th><th>Uploaded</th><th>Action</th></tr></thead>
          <tbody>
            ${subs.map(s => `<tr>
              <td>${esc(s.ModuleTitle)}</td>
              <td>${esc(s.FileName)}</td>
              <td><span class="pill ${s.Status === 'reviewed' ? 'ok' : 'info'}">${esc(s.Status)}</span></td>
              <td>${fmtShort(s.UploadedAt)}</td>
              <td><a href="${esc(s.DriveURL)}" target="_blank" rel="noopener">Open</a></td>
            </tr>`).join('')}
          </tbody>
        </table></div>` : '<p class="small">No submissions yet.</p>'}
    </div>`;

  document.getElementById('portfolioForm').addEventListener('submit', async ev => {
    ev.preventDefault();
    const fd = new FormData(ev.target);
    const file = fd.get('file');
    const moduleId = fd.get('moduleId');
    if (!file || !file.size) { toast('Select a file', 'warn'); return; }
    if (file.size > 10 * 1024 * 1024) { toast('File exceeds 10 MB', 'bad'); return; }
    const ext = (file.name.split('.').pop() || '').toLowerCase();
    if (!['pdf','doc','docx','jpg','jpeg','png'].includes(ext)) { toast('File type not allowed', 'bad'); return; }
    const reader = new FileReader();
    reader.onload = async () => {
      const b64 = String(reader.result).split(',')[1];
      try {
        toast('Uploading…', 'info');
        const r = await api('submitPortfolio', {
          moduleId, fileName: file.name,
          fileType: file.type || 'application/octet-stream',
          fileSizeBytes: file.size, fileBase64: b64
        });
        if (!r.ok) { toast(r.error || 'Upload failed', 'bad'); return; }
        toast('Portfolio uploaded ✓', 'ok');
        renderPortfolio();
      } catch(e){ toast('Upload error: ' + e.message, 'bad'); }
    };
    reader.readAsDataURL(file);
  });
}

async function renderAdmin(tab){
  if (!state.user || (state.user.role !== 'admin' && state.user.role !== 'instructor')) {
    toast('Admin access required', 'bad'); return;
  }
  tab = tab || 'users';

  app().innerHTML = `
    <div class="card card-hero">
      <h1 style="margin:0">⚙️ Administration</h1>
      <p class="small" style="margin:.35rem 0 0">Manage users, content, exams, and OSCE grading.</p>
    </div>
    <div class="tabs">
      <button class="tab ${tab==='users'?'active':''}" data-tab="users">👥 Users</button>
      <button class="tab ${tab==='content'?'active':''}" data-tab="content">📚 Content</button>
      <button class="tab ${tab==='exams'?'active':''}" data-tab="exams">📝 Exam questions</button>

      <button class="tab ${tab==='osce'?'active':''}" data-tab="osce">🩺 OSCE grading</button>
    </div>

  document.querySelectorAll('[data-tab]').forEach(b => {
    b.addEventListener('click', () => renderAdmin(b.getAttribute('data-tab')));
  });

  const c = document.getElementById('adminContent');
  if (tab === 'users')      await adminUsers(c);
  else if (tab === 'content')   await adminContent(c);

  else if (tab === 'osce')      await adminOsce(c);
}

          if (!r2.ok) { toast(r2.error, 'bad'); return; }
          toast(type + ' passcode updated ✓', 'ok');
        } catch(e){ toast(e.message, 'bad'); }
      });
    });
  } catch(e){ c.innerHTML = `<div class="msg bad">${esc(e.message)}</div>`; }
}

async function adminGrades(c){
  c.innerHTML = '<div class="card"><span class="small">Loading grades…</span></div>';
  try {
    const r = await api('listAllGrades', {});
    if (!r.ok) { c.innerHTML = `<div class="msg bad">${esc(r.error)}</div>`; return; }
    const grades = r.data.grades || [];
    c.innerHTML = `
      <div class="card">
        <h3>All learners (${grades.length})</h3>
        <div class="tbl-wrap"><table class="data">
          <thead><tr><th>Name</th><th>Quiz</th><th>Exams</th><th>OSCE</th><th>Final</th></tr></thead>
          <tbody>
            ${grades.map(g => `<tr>
              <td>${esc(g.learnerName)}</td>
              <td>${g.quizAverage}%</td>
              <td>${g.examAverage}%</td>
              <td>${g.osce ? g.osce.percentage + '%' : '—'}</td>
              <td><strong style="color:${g.finalPercentage >= PASS_THRESHOLD ? 'var(--ok)' : 'var(--bad)'}">${g.finalPercentage}%</strong></td>
            </tr>`).join('')}
          </tbody>
        </table></div>
      </div>`;
  } catch(e){ c.innerHTML = `<div class="msg bad">${esc(e.message)}</div>`; }
}

async function adminOsce(c){
  c.innerHTML = `
    <div class="card">
      <h3>10-domain OSCE grading</h3>
      <p class="small">Each domain scored 0–2. Total out of 20. Pass mark ${PASS_THRESHOLD}%.</p>
      <form id="osceForm">
        <label>Learner email<input name="learnerEmail" type="email" required placeholder="learner@example.com"></label>
        <div id="osceDomains"></div>
        <label>Notes<textarea name="notes" placeholder="Optional feedback…"></textarea></label>
        <button class="btn primary" type="submit">Submit OSCE</button>
      </form>
    </div>`;
  const domains = [
    'Assessment & history taking',
    'Communication & rapport',
    'Infection control & hand hygiene',
    'Patient safety & identification',
    'Clinical skill execution',
    'Documentation',
    'Teamwork & escalation',
    'Professionalism & ethics',
    'Family-centred education',
    'Critical thinking & prioritisation'
  ];
  const wrap = document.getElementById('osceDomains');
  domains.forEach((name, i) => {
    const div = el(`
      <div class="osce-domain-card">
        <div class="dom-head">
          <h4>D${i+1}. ${esc(name)}</h4>
          <span class="small" data-score-preview>—</span>
        </div>
        <div class="osce-rubric-grid">
          <label class="rubric-box"><input type="radio" name="d${i+1}" value="0" required><strong>0 — Not done</strong>Omitted or unsafe</label>
          <label class="rubric-box"><input type="radio" name="d${i+1}" value="1"><strong>1 — Partly done</strong>Needs prompting</label>
          <label class="rubric-box"><input type="radio" name="d${i+1}" value="2"><strong>2 — Done well</strong>Independent &amp; safe</label>
        </div>
      </div>`);
    wrap.appendChild(div);
    const preview = div.querySelector('[data-score-preview]');
    div.querySelectorAll('input[type=radio]').forEach(r => r.addEventListener('change', () => {
      div.querySelectorAll('.rubric-box').forEach(o => o.classList.remove('selected'));
      r.closest('.rubric-box').classList.add('selected');
      preview.textContent = r.value + '/2';
    }));
  });

  document.getElementById('osceForm').addEventListener('submit', async ev => {
    ev.preventDefault();
    const data = Object.fromEntries(new FormData(ev.target).entries());
    try {
      const r = await api('submitOsce', data);
      if (!r.ok) { toast(r.error, 'bad'); return; }
      const d = r.data;
      toast(`OSCE submitted — ${d.percentage}% (${d.pass ? 'PASS' : 'FAIL'})`, d.pass ? 'ok' : 'warn');
      if (d.certificate) toast('Certificate issued: ' + d.certificate.CertCode, 'ok');
      ev.target.reset();
      wrap.querySelectorAll('.selected').forEach(x => x.classList.remove('selected'));
      wrap.querySelectorAll('[data-score-preview]').forEach(x => x.textContent = '—');
    } catch(e){ toast(e.message, 'bad'); }
  });
}

/* ============================================================
   ROUTER
   ============================================================ */
function route(name, params){
  params = params || {};
  if (!state.token) { renderAuth('login'); return; }
  document.querySelectorAll('#mainNav button[data-nav]').forEach(b => {
    b.classList.toggle('active', b.getAttribute('data-nav') === name);
  });
  switch(name){
    case 'dashboard':    renderDashboard(); break;
    case 'module':       renderModule(params); break;
    case 'exams':        renderExams(); break;
    case 'grades':       renderGrades(); break;
    case 'certificates': renderCertificates(); break;
    case 'portfolio':    renderPortfolio(); break;
    case 'admin':        renderAdmin(params.tab); break;
    default:             renderDashboard();
  }
}

/* ============================================================
   NAV + LOGOUT
   ============================================================ */
document.querySelectorAll('#mainNav button[data-nav]').forEach(b => {
  b.addEventListener('click', () => route(b.getAttribute('data-nav')));
});
document.getElementById('logoutBtn').addEventListener('click', async () => {
  try { await api('logout', {}); } catch(e){}
  clearSession();
  renderAuth('login');
  toast('Logged out', 'ok');
});

/* ============================================================
   ONLINE / OFFLINE
   ============================================================ */
function setOnline(isOnline){
  state.online = isOnline;
  const b = document.getElementById('netBadge');
  const banner = document.getElementById('offlineBanner');
  if (isOnline) {
    b.className = 'badge ok'; b.innerHTML = '<span class="dot"></span><span>Online</span>';
    banner.classList.add('hidden');
    flushQueue();
  } else {
    b.className = 'badge warn'; b.innerHTML = '<span class="dot"></span><span>Offline</span>';
    banner.classList.remove('hidden');
  }
}
window.addEventListener('online', () => { setOnline(true); toast('Back online', 'ok'); });
window.addEventListener('offline', () => { setOnline(false); toast('Offline — changes will queue', 'warn'); });

setInterval(() => { if (state.online && state.token) flushQueue(); }, OFFLINE.SYNC_INTERVAL_MS);
setInterval(async () => {
  if (!state.online) return;
  try {
    await fetch(API_URL, {
      method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify({ action: 'ping' })
    });
  } catch(e){ /* ignore */ }
}, OFFLINE.PING_INTERVAL_MS);

/* ============================================================
   SERVICE WORKER
   ============================================================ */
if ('serviceWorker' in navigator && OFFLINE.ENABLED) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register(OFFLINE.SERVICE_WORKER).catch(() => {});
  });
}

/* ============================================================
   BOOT
   ============================================================ */
(function boot(){
  setOnline(navigator.onLine);
  refreshHeader();
  updatePendingBadge();
  if (state.token && state.user) {
    if (state.currentExam && !state.currentExam.submitted) renderExamUI();
    else route('dashboard');
  } else renderAuth('login');
})();
</script>
