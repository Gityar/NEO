<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Neonatal Nursing LMS</title>
<script src="config.js"></script>
<style>
:root{
  --ink:#0d1f26; --ink-soft:#35525d; --muted:#54707c;
  --brand:#0d7d76; --brand-600:#0a5f5a; --brand-50:#e7f4f3; --brand-100:#cfe9e6;
  --ok:#166534; --ok-50:#dcfce7; --bad:#b91c1c; --bad-50:#fee2e2;
  --warn:#b45309; --warn-50:#fef3e2;
  --bg:#eef5f5; --card:#fff; --line:#d3e3e6; --line-soft:#e8f1f2;
  --radius:12px; --shadow:0 1px 3px rgba(13,31,38,.08),0 8px 24px rgba(13,31,38,.04);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;background:var(--bg);color:var(--ink);line-height:1.55;font-size:15px}
a{color:var(--brand-600);text-decoration:none}
a:hover{text-decoration:underline}
button{font-family:inherit;font-size:14px;cursor:pointer}
h1,h2,h3,h4{color:var(--ink);margin:0 0 .5rem;line-height:1.25}
h1{font-size:1.6rem}h2{font-size:1.25rem}h3{font-size:1.1rem}h4{font-size:1rem}
p{margin:0 0 .75rem}
.small{font-size:.85rem;color:var(--muted)}
.center{text-align:center}
.hidden{display:none !important}
.flex-row{display:flex;gap:.5rem;flex-wrap:wrap;align-items:center}
.space-between{display:flex;justify-content:space-between;align-items:center;gap:.75rem;flex-wrap:wrap}

.topbar{position:sticky;top:0;z-index:100;background:var(--brand);color:#fff;padding:.75rem 1rem;display:flex;align-items:center;justify-content:space-between;gap:1rem;box-shadow:0 2px 8px rgba(0,0,0,.1)}
.brand{font-weight:700;font-size:1.05rem;letter-spacing:.01em}
.topbar-right{display:flex;align-items:center;gap:.5rem;flex-wrap:wrap}
.badge{display:inline-block;padding:.15rem .6rem;border-radius:999px;font-size:.72rem;font-weight:700;letter-spacing:.03em;background:rgba(255,255,255,.2);color:#fff}
.badge.ok{background:#1a7a4a}.badge.warn{background:#b45309}.badge.bad{background:#b91c1c}
.btn-ghost{background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.25);color:#fff;padding:.35rem .8rem;border-radius:8px;font-weight:600}
.btn-ghost:hover{background:rgba(255,255,255,.28)}

.mainnav{background:var(--card);border-bottom:1px solid var(--line);padding:.35rem 1rem;display:flex;gap:.25rem;overflow-x:auto}
.mainnav button{background:transparent;border:1px solid transparent;border-radius:8px;padding:.5rem .9rem;font-weight:600;color:var(--ink-soft);white-space:nowrap}
.mainnav button.active{background:var(--brand-50);color:var(--brand-600);border-color:var(--brand-100)}
.mainnav button:hover{background:var(--line-soft)}

main#app{max-width:1120px;margin:1.25rem auto;padding:0 1rem}

.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:1.25rem;margin-bottom:1rem;box-shadow:var(--shadow)}
.grid{display:grid;gap:1rem;grid-template-columns:repeat(auto-fill,minmax(260px,1fr))}
.mod-card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:1rem;cursor:pointer;transition:transform .15s,border-color .15s}
.mod-card:hover{transform:translateY(-2px);border-color:var(--brand-100)}
.mod-card .mod-num{display:inline-block;background:var(--brand-50);color:var(--brand-600);padding:.15rem .55rem;border-radius:6px;font-weight:700;font-size:.78rem;margin-bottom:.35rem}
.mod-card h3{margin:.35rem 0}
.mod-card p{color:var(--muted);font-size:.9rem;margin:0}
.mod-card .mod-meta{margin-top:.55rem;font-size:.78rem;color:var(--muted)}

.btn{display:inline-block;padding:.6rem 1.1rem;border:1px solid transparent;border-radius:8px;font-weight:600;background:#e6eef0;color:var(--ink);transition:background .12s}
.btn:hover{background:#d8e3e6}
.btn.primary{background:var(--brand);color:#fff}
.btn.primary:hover{background:var(--brand-600)}
.btn.danger{background:#dc2626;color:#fff}
.btn.danger:hover{background:#b91c1c}
.btn.ghost{background:transparent;border-color:var(--line);color:var(--ink-soft)}
.btn.ghost:hover{background:var(--line-soft)}
.btn:disabled{opacity:.55;cursor:not-allowed}
.btn-sm{padding:.35rem .7rem;font-size:.83rem}
.btn-block{display:block;width:100%}

label{display:block;margin-bottom:.9rem;font-weight:600;font-size:.9rem}
input,textarea,select{display:block;width:100%;margin-top:.35rem;padding:.65rem .75rem;border:1px solid var(--line);border-radius:8px;font-size:1rem;font-family:inherit;background:#fff;color:var(--ink)}
input:focus,textarea:focus,select:focus{outline:2px solid var(--brand-100);outline-offset:0;border-color:var(--brand)}
textarea{resize:vertical;min-height:90px}
.form-card{max-width:420px;margin:2rem auto}
.form-title{margin-bottom:1rem}

.msg{padding:.75rem 1rem;border-radius:8px;margin-bottom:.75rem;font-size:.93rem}
.msg.ok{background:var(--ok-50);color:var(--ok);border:1px solid #86efac}
.msg.bad{background:var(--bad-50);color:var(--bad);border:1px solid #fca5a5}
.msg.warn{background:var(--warn-50);color:var(--warn);border:1px solid #fbbf24}
.msg.info{background:var(--brand-50);color:var(--brand-600);border:1px solid var(--brand-100)}

.lesson-wrap{display:flex;gap:1rem}
.lesson-nav{flex:0 0 250px;position:sticky;top:5rem;align-self:flex-start;max-height:calc(100vh - 6rem);overflow-y:auto;background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:.75rem}
.lesson-nav h4{font-size:.8rem;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);margin:.5rem 0 .4rem}
.lesson-nav a{display:block;padding:.45rem .6rem;border-radius:6px;color:var(--ink-soft);font-size:.9rem;margin-bottom:.15rem;cursor:pointer}
.lesson-nav a:hover{background:var(--line-soft)}
.lesson-nav a.active{background:var(--brand-50);color:var(--brand-600);font-weight:600}
.lesson-main{flex:1;min-width:0;background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:1.5rem;box-shadow:var(--shadow)}
.lesson-main .lesson-lead{font-size:1.05rem;color:var(--ink-soft)}
.lesson-main h3.lesson-h{color:var(--brand-600);margin-top:1.5rem;padding-bottom:.3rem;border-bottom:2px solid var(--brand-50)}
.lesson-callout{padding:.9rem 1.1rem;border-left:4px solid var(--brand);background:var(--brand-50);border-radius:6px;margin:1rem 0}
.lesson-callout.warn{border-color:var(--warn);background:var(--warn-50)}
.lesson-callout.danger{border-color:var(--bad);background:var(--bad-50)}
.lesson-callout.ok{border-color:var(--ok);background:var(--ok-50)}
.lesson-cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:.75rem;margin:1rem 0}
.lesson-card{background:var(--brand-50);border:1px solid var(--brand-100);border-radius:8px;padding:.85rem}
.lesson-card .card-num{display:inline-block;background:var(--brand);color:#fff;width:24px;height:24px;text-align:center;border-radius:50%;font-weight:700;font-size:.78rem;line-height:24px;margin-bottom:.35rem}
.lesson-tbl{margin:1rem 0}
.lesson-tbl figcaption{font-weight:600;margin-bottom:.5rem;color:var(--brand-600)}
.lesson-tbl-scroll{overflow-x:auto;border:1px solid var(--line);border-radius:8px}
.lesson-tbl table{width:100%;border-collapse:collapse;font-size:.9rem}
.lesson-tbl th,.lesson-tbl td{padding:.55rem .7rem;text-align:left;border-bottom:1px solid var(--line-soft);vertical-align:top}
.lesson-tbl th{background:var(--line-soft);font-size:.8rem;text-transform:uppercase;letter-spacing:.04em;color:var(--ink-soft)}
.lesson-formula{background:#f8fafb;border:1px dashed var(--line);border-radius:8px;padding:1rem;margin:1rem 0;font-family:'Courier New',monospace;font-size:.92rem}
.lesson-calc{background:var(--brand-50);border:1px solid var(--brand-100);border-radius:8px;padding:1rem;margin:1rem 0}
.calc-row{display:flex;gap:.5rem;align-items:center;flex-wrap:wrap}
.calc-row input{flex:1;min-width:120px;max-width:180px;margin:0}
.calc-feedback{margin-top:.5rem;font-weight:600}
.calc-feedback.ok{color:var(--ok)}.calc-feedback.bad{color:var(--bad)}
.lesson-discuss{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:1rem;margin:1.25rem 0}
.note-status{font-size:.8rem;color:var(--muted);margin-top:.3rem;min-height:1.1rem}
.note-status.ok{color:var(--ok)}.note-status.bad{color:var(--bad)}
.lesson-pbl{background:var(--warn-50);border:1px solid #fcd34d;border-radius:10px;margin:1.25rem 0;overflow:hidden}
.pbl-header{background:#f59e0b;color:#fff;padding:.65rem 1rem;font-weight:700;font-size:.92rem}
.pbl-body{padding:1rem}
.pbl-scenario{background:#fff;border-left:3px solid #f59e0b;padding:.75rem .9rem;margin-bottom:.85rem;font-style:italic;border-radius:4px}
.lesson-checklist{background:#f8fafb;border:1px solid var(--line);border-radius:8px;padding:1rem;margin:1.25rem 0}
.lesson-checklist label{display:flex;align-items:flex-start;gap:.55rem;margin-bottom:.45rem;font-weight:400;font-size:.92rem;cursor:pointer}
.lesson-checklist input[type=checkbox]{margin-top:.2rem;width:auto;flex-shrink:0}
.lesson-actions{display:flex;justify-content:space-between;align-items:center;gap:.75rem;margin-top:1.5rem;padding-top:1rem;border-top:1px solid var(--line);flex-wrap:wrap}

.quiz-block{margin-top:2rem;padding:1.25rem;background:#f8fafb;border:1px solid var(--line);border-radius:10px}
.quiz-q{margin-bottom:1.25rem}
.quiz-q .q-text{font-weight:600;margin-bottom:.6rem}
.quiz-opt{display:flex;align-items:flex-start;gap:.5rem;padding:.55rem .75rem;border:1px solid var(--line);border-radius:8px;margin-bottom:.4rem;cursor:pointer;background:#fff}
.quiz-opt input{width:auto;margin:0;flex-shrink:0;margin-top:.2rem}
.quiz-opt.correct{border-color:var(--ok);background:var(--ok-50)}
.quiz-opt.wrong{border-color:var(--bad);background:var(--bad-50)}
.quiz-explain{background:var(--brand-50);padding:.6rem .8rem;border-radius:6px;margin-top:.5rem;font-size:.9rem}
.quiz-result{padding:.75rem 1rem;border-radius:8px;margin-top:1rem;font-weight:600}
.quiz-result.ok{background:var(--ok-50);color:var(--ok)}
.quiz-result.bad{background:var(--bad-50);color:var(--bad)}

.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:8px;background:var(--card)}
table.data{width:100%;border-collapse:collapse;font-size:.9rem}
table.data th,table.data td{padding:.55rem .75rem;text-align:left;border-bottom:1px solid var(--line-soft);vertical-align:top}
table.data th{background:var(--line-soft);font-size:.78rem;text-transform:uppercase;letter-spacing:.04em;color:var(--ink-soft)}
table.data tr:last-child td{border-bottom:none}
table.data tr:hover{background:#f8fafb}

.tabs{display:flex;gap:.25rem;border-bottom:1px solid var(--line);margin-bottom:1rem;overflow-x:auto}
.tab{background:transparent;border:1px solid transparent;border-bottom:none;padding:.55rem .9rem;font-weight:600;color:var(--muted);border-radius:8px 8px 0 0;white-space:nowrap}
.tab.active{background:var(--card);border-color:var(--line);color:var(--brand-600);margin-bottom:-1px}

.modal-backdrop{position:fixed;inset:0;background:rgba(13,31,38,.45);display:flex;align-items:center;justify-content:center;padding:1rem;z-index:500}
.modal-card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:1.25rem;width:100%;max-width:640px;max-height:90vh;overflow-y:auto;box-shadow:0 12px 32px rgba(0,0,0,.22)}

.toast{position:fixed;bottom:1rem;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:.7rem 1.2rem;border-radius:8px;box-shadow:0 4px 20px rgba(0,0,0,.2);z-index:1000;font-size:.9rem;max-width:90vw}
.toast.ok{background:var(--ok)}.toast.bad{background:var(--bad)}.toast.warn{background:var(--warn)}
.offline-banner{background:var(--warn);color:#fff;text-align:center;padding:.5rem 1rem;font-weight:600;font-size:.9rem}

@media(max-width:760px){
  .lesson-wrap{flex-direction:column}
  .lesson-nav{position:static;flex:none;max-height:none}
  .topbar{padding:.55rem .75rem;flex-wrap:wrap}
  main#app{margin:.75rem auto;padding:0 .75rem}
}
</style>
</head>
<body>

<header class="topbar">
  <div class="brand" id="brandLabel">Neonatal Nursing LMS</div>
  <div class="topbar-right">
    <span class="badge ok" id="netBadge">Online</span>
    <span class="badge warn hidden" id="pendingBadge">0 queued</span>
    <span class="small hidden" style="color:#e6f4f3" id="userName"></span>
    <button class="btn-ghost hidden" id="logoutBtn">Log out</button>
  </div>
</header>

<nav class="mainnav hidden" id="mainNav">
  <button data-nav="dashboard" class="active">Learn</button>
  <button data-nav="grades">My grades</button>
  <button data-nav="certificates">Certificates</button>
  <button data-nav="portfolio">Portfolio</button>
  <button data-nav="admin" id="adminNavBtn" class="hidden">Admin</button>
</nav>

<div id="offlineBanner" class="offline-banner hidden">⚠ You are offline — cached content &amp; queued updates active.</div>

<main id="app"></main>
<div id="modalRoot" class="hidden"></div>
<div id="toast" class="toast hidden"></div>

<script>
const CFG = window.LMS_CONFIG || {};
const API_URL = CFG.API_URL || '';
const COURSE_TITLE = CFG.COURSE_TITLE || 'Neonatal Nursing';
const PASS_THRESHOLD = Number(CFG.PASS_THRESHOLD) || 80;
const OFFLINE = Object.assign({
  ENABLED: true, SERVICE_WORKER: 'sw.js', CACHE_VERSION: 'lms-v3',
  QUEUE_MAX_ITEMS: 200, QUEUE_MAX_RETRIES: 5, SYNC_BATCH_SIZE: 25,
  SYNC_INTERVAL_MS: 30000, PING_INTERVAL_MS: 60000
}, CFG.OFFLINE || {});

const $  = (s, el) => (el || document).querySelector(s);
const $$ = (s, el) => Array.from((el || document).querySelectorAll(s));
const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' })[c]);
const uid = () => (crypto.randomUUID ? crypto.randomUUID() : 'u_' + Math.random().toString(36).slice(2) + Date.now().toString(36));
function toast(msg, kind) {
  const el = $('#toast'); el.textContent = msg;
  el.className = 'toast ' + (kind || '');
  el.hidden = false;
  clearTimeout(toast._t); toast._t = setTimeout(() => { el.hidden = true; }, 2800);
}
function debounce(fn, ms) {
  let t; return function() { const a = arguments, c = this; clearTimeout(t); t = setTimeout(() => fn.apply(c, a), ms); };
}
function closeModal() {
  const mr = $('#modalRoot'); mr.innerHTML = ''; mr.classList.add('hidden');
}
function openModal(html) {
  const mr = $('#modalRoot');
  mr.innerHTML = `<div class="modal-backdrop" id="modalBackdrop"><div class="modal-card">${html}</div></div>`;
  mr.classList.remove('hidden');
  $('#modalBackdrop').addEventListener('click', (e) => { if (e.target.id === 'modalBackdrop') closeModal(); });
}

/* ---------- IndexedDB ---------- */
const DB_NAME = 'lms_offline';
const DB_VERSION = 2;
let _dbPromise = null;
function dbOpen() {
  if (_dbPromise) return _dbPromise;
  _dbPromise = new Promise((resolve, reject) => {
    const req = indexedDB.open(DB_NAME, DB_VERSION);
    req.onupgradeneeded = (e) => {
      const db = e.target.result;
      if (!db.objectStoreNames.contains('kv'))      db.createObjectStore('kv',      { keyPath: 'key' });
      if (!db.objectStoreNames.contains('pending')) db.createObjectStore('pending', { keyPath: 'id' });
    };
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
  return _dbPromise;
}
async function idbPut(store, val) {
  const db = await dbOpen();
  return new Promise((res, rej) => {
    const tx = db.transaction(store, 'readwrite');
    tx.objectStore(store).put(val);
    tx.oncomplete = () => res(); tx.onerror = () => rej(tx.error);
  });
}
async function idbGet(store, key) {
  const db = await dbOpen();
  return new Promise((res, rej) => {
    const tx = db.transaction(store, 'readonly');
    const req = tx.objectStore(store).get(key);
    req.onsuccess = () => res(req.result || null); req.onerror = () => rej(req.error);
  });
}
async function idbAll(store) {
  const db = await dbOpen();
  return new Promise((res, rej) => {
    const tx = db.transaction(store, 'readonly');
    const req = tx.objectStore(store).getAll();
    req.onsuccess = () => res(req.result || []); req.onerror = () => rej(req.error);
  });
}
async function idbDel(store, key) {
  const db = await dbOpen();
  return new Promise((res, rej) => {
    const tx = db.transaction(store, 'readwrite');
    tx.objectStore(store).delete(key);
    tx.oncomplete = () => res(); tx.onerror = () => rej(tx.error);
  });
}
const kvGet = (k)    => idbGet('kv', k).then(r => r ? r.val : null);
const kvSet = (k, v) => idbPut('kv', { key: k, val: v, at: Date.now() });

/* ---------- State ---------- */
const state = {
  token: localStorage.getItem('lms_token') || '',
  user:  safeJSON(localStorage.getItem('lms_user')) || null,
  view:  'loading',
  params: {},
  content: null,
  userData: {},
  online: navigator.onLine,
  pendingCount: 0
};
function safeJSON(s) { try { return s ? JSON.parse(s) : null; } catch { return null; } }
function fetchJSON(url, body) {
  return fetch(url, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(body) })
    .then(r => { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); });
}

const READ_ACTIONS = new Set([
  'me', 'listContent', 'getQuizGroupScore', 'getUserData',
  'listMyPortfolio', 'listAllPortfolios', 'listUsers', 'listAllGrades',
  'listOsce', 'listCertificates', 'listAudit', 'computeLearnerGrade', 'ping'
]);
const WRITE_ACTIONS = new Set([
  'saveUserData', 'submitQuizGroup', 'updateUser', 'deleteUser', 'adminCreateUser',
  'createModule', 'updateModule', 'deleteModule',
  'createLesson', 'updateLesson', 'deleteLesson',
  'createQuiz', 'updateQuiz', 'deleteQuiz', 'submitOsce',
  'adminUpdateModuleGrade', 'updatePortfolioStatus', 'submitPortfolio'
]);
const ONLINE_ONLY = new Set([
  'login', 'logout', 'register', 'forgot', 'reset',
  'submitPortfolio', 'updatePortfolioStatus', 'updateUser', 'deleteUser', 'adminCreateUser',
  'createModule', 'updateModule', 'deleteModule',
  'createLesson', 'updateLesson', 'deleteLesson',
  'createQuiz', 'updateQuiz', 'deleteQuiz', 'submitOsce', 'adminUpdateModuleGrade'
]);

function cacheKey(action, body) {
  const b = Object.assign({}, body || {}); delete b.token;
  return 'cache:' + action + ':' + JSON.stringify(b, Object.keys(b).sort());
}

async function apiCall(action, body, opts) {
  opts = opts || {};
  const payload = Object.assign({}, body || {}, { action, token: state.token });

  if (state.online && !opts.forceCache) {
    try {
      const res = await fetchJSON(API_URL, payload);
      if (res && res.ok) {
        if (READ_ACTIONS.has(action)) await kvSet(cacheKey(action, body), { data: res.data, at: Date.now() });
        return { ok: true, data: res.data, fromCache: false };
      }
      if (res && res.code === 401) clearSession();
      return { ok: false, error: (res && res.error) || 'Server error', code: res && res.code };
    } catch (netErr) {}
  }

  if (ONLINE_ONLY.has(action)) return { ok: false, error: 'This action needs an internet connection.', offline: true };
  if (READ_ACTIONS.has(action)) {
    const cached = await kvGet(cacheKey(action, body));
    if (cached && cached.data) return { ok: true, data: cached.data, fromCache: true };
    return { ok: false, error: 'Offline and no cached copy of this data.' };
  }
  if (WRITE_ACTIONS.has(action)) {
    const optimistic = await applyOptimisticLocal(action, body || {});
    await queueAction(action, body || {});
    return { ok: true, data: optimistic, queued: true, offline: true };
  }
  return { ok: false, error: 'Action not available offline: ' + action };
}

async function applyOptimisticLocal(action, body) {
  if (action === 'saveUserData') {
    state.userData[body.dataKey] = body.dataValue;
    await kvSet('userData', state.userData);
    return { message: 'Saved locally.', offline: true };
  }
  if (action === 'submitQuizGroup') {
    const mod = ((state.content && state.content.modules) || []).find(m => String(m.ModuleID) === String(body.moduleId));
    if (!mod) return { message: 'Queued.', offline: true };
    const qmap = {}; (mod.Quizzes || []).forEach(q => qmap[q.QuizID] = q);
    let correct = 0, total = 0; const results = [];
    (body.answers || []).forEach(a => {
      const q = qmap[a.quizId]; if (!q) return;
      total++;
      const ok = Number(a.chosenIndex) === Number(q.CorrectIndex);
      if (ok) correct++;
      results.push({ quizId: q.QuizID, question: q.Question, options: [q.OptionA, q.OptionB, q.OptionC, q.OptionD],
        chosenIndex: a.chosenIndex, correctIndex: q.CorrectIndex, correct: ok, explanation: q.Explanation || '' });
    });
    const percentage = total ? Math.round((correct / total) * 1000) / 10 : 0;
    const local = (await kvGet('quizLocal')) || {};
    const prev = local[body.moduleId];
    local[body.moduleId] = {
      moduleId: body.moduleId, moduleTitle: mod.Title, score: correct, total, percentage,
      attemptCount: (prev ? prev.attemptCount : 0) + 1, attemptedAt: new Date().toISOString(), offline: true
    };
    await kvSet('quizLocal', local);
    return { attemptId: 'local-' + uid(), results, score: correct, total, percentage,
      attemptCount: local[body.moduleId].attemptCount, attemptedAt: local[body.moduleId].attemptedAt, offline: true };
  }
  return { message: 'Queued.', offline: true };
}

async function queueAction(action, body) {
  const clean = Object.assign({}, body); delete clean.token; delete clean.action;
  const item = { id: uid(), action, body: clean, at: Date.now(), retries: 0 };
  const items = await idbAll('pending');
  if (items.length >= OFFLINE.QUEUE_MAX_ITEMS) {
    items.sort((a, b) => a.at - b.at);
    await idbDel('pending', items[0].id);
  }
  await idbPut('pending', item);
  await refreshPendingBadge();
}
async function refreshPendingBadge() {
  const items = await idbAll('pending');
  state.pendingCount = items.length;
  const badge = $('#pendingBadge');
  if (!items.length) badge.classList.add('hidden');
  else { badge.textContent = items.length + ' queued'; badge.classList.remove('hidden'); }
}
async function flushQueue() {
  if (!state.online || !state.token) return;
  const items = await idbAll('pending');
  if (!items.length) { await refreshPendingBadge(); return; }
  for (let i = 0; i < items.length; i += OFFLINE.SYNC_BATCH_SIZE) {
    const batch = items.slice(i, i + OFFLINE.SYNC_BATCH_SIZE);
    try {
      const res = await fetchJSON(API_URL, {
        action: 'syncBatch', token: state.token,
        items: batch.map(it => ({ clientId: it.id, action: it.action, body: it.body }))
      });
      if (!res || !res.ok || !res.data || !Array.isArray(res.data.results)) return;
      for (const r of res.data.results) {
        if (r.ok) await idbDel('pending', r.clientId);
        else {
          const item = await idbGet('pending', r.clientId);
          if (!item) continue;
          item.retries = (item.retries || 0) + 1;
          if (item.retries >= OFFLINE.QUEUE_MAX_RETRIES) await idbDel('pending', item.id);
          else await idbPut('pending', item);
        }
      }
    } catch (e) { break; }
  }
  await refreshPendingBadge();
}

function saveSession(token, user) {
  state.token = token; state.user = user;
  localStorage.setItem('lms_token', token);
  localStorage.setItem('lms_user', JSON.stringify(user));
}
function clearSession() {
  state.token = ''; state.user = null;
  localStorage.removeItem('lms_token');
  localStorage.removeItem('lms_user');
}
function isInstructorOrAdmin() { return state.user && (state.user.role === 'admin' || state.user.role === 'instructor'); }
function isAdmin() { return state.user && state.user.role === 'admin'; }

function updateNetBadge() {
  const badge = $('#netBadge'), banner = $('#offlineBanner');
  if (state.online) { badge.textContent = 'Online'; badge.className = 'badge ok'; banner.classList.add('hidden'); }
  else { badge.textContent = 'Offline'; badge.className = 'badge warn'; banner.classList.remove('hidden'); }
  $('#logoutBtn').classList.toggle('hidden', !state.token);
  $('#userName').classList.toggle('hidden', !state.user);
  if (state.user) $('#userName').textContent = state.user.name + ' · ' + state.user.role;
  $('#mainNav').classList.toggle('hidden', !state.token);
  $('#adminNavBtn').classList.toggle('hidden', !isInstructorOrAdmin());
}

async function ping() {
  if (!API_URL) return;
  try {
    const res = await fetchJSON(API_URL, { action: 'ping' });
    state.online = !!(res && res.ok);
  } catch (e) { state.online = false; }
  updateNetBadge();
  if (state.online && state.pendingCount > 0) await flushQueue();
}

async function preloadAll() {
  const [ud, co] = await Promise.all([
    apiCall('getUserData', { prefix: '' }),
    apiCall('listContent', {})
  ]);
  if (ud.ok && ud.data && ud.data.data) state.userData = Object.assign({}, ud.data.data, state.userData);
  const localUD = await kvGet('userData');
  if (localUD) state.userData = Object.assign({}, localUD, state.userData);
  if (co.ok && co.data) state.content = co.data;
}
async function ensureContent(forceRefresh) {
  if (!forceRefresh && state.content && state.content.modules) return state.content;
  const res = await apiCall('listContent', {});
  if (res.ok) { state.content = res.data; return state.content; }
  return state.content || null;
}

/* ---------- Routing ---------- */
function render() {
  const app = $('#app');
  updateNetBadge();
  if (!state.token) return renderLogin(app);
  switch (state.view) {
    case 'dashboard':    return renderDashboard(app);
    case 'module':       return renderModule(app, state.params.moduleId);
    case 'grades':       return renderGrades(app);
    case 'certificates': return renderCertificates(app);
    case 'portfolio':    return renderPortfolio(app);
    case 'admin':        return renderAdmin(app, state.params.tab);
    default:             return renderDashboard(app);
  }
}

/* ---------- Login / Register ---------- */
function renderLogin(app) {
  app.innerHTML = `
    <div class="form-card card">
      <h2 class="form-title">${esc(COURSE_TITLE)}</h2>
      <p class="small">Sign in, or create a new learner account.</p>
      <div class="tabs" style="margin-bottom:1rem">
        <button class="tab active" data-auth-tab="login">Sign in</button>
        <button class="tab" data-auth-tab="register">Register</button>
      </div>
      <form id="loginForm">
        <label>Email<input type="email" name="email" required autocomplete="email"></label>
        <label>Password<input type="password" name="password" required autocomplete="current-password"></label>
        <button class="btn primary btn-block" type="submit">Sign in</button>
        <p class="small" style="margin-top:.75rem"><a href="#" id="forgotLink">Forgot password?</a></p>
      </form>
      <form id="registerForm" class="hidden">
        <label>Full name<input type="text" name="name" required autocomplete="name"></label>
        <label>Email<input type="email" name="email" required autocomplete="email"></label>
        <label>Password (min 8 chars)<input type="password" name="password" required minlength="8" autocomplete="new-password"></label>
        <button class="btn primary btn-block" type="submit">Create account</button>
      </form>
      <div id="authMsg"></div>
    </div>
  `;
  const msgBox = () => $('#authMsg');
  const showMsg = (text, kind) => { msgBox().innerHTML = `<div class="msg ${kind}">${esc(text)}</div>`; };

  $$('[data-auth-tab]').forEach(b => b.addEventListener('click', () => {
    $$('[data-auth-tab]').forEach(x => x.classList.toggle('active', x === b));
    $('#loginForm').classList.toggle('hidden', b.dataset.authTab !== 'login');
    $('#registerForm').classList.toggle('hidden', b.dataset.authTab !== 'register');
    msgBox().innerHTML = '';
  }));

  $('#loginForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const f = e.target;
    const btn = f.querySelector('button[type=submit]');
    btn.disabled = true; btn.textContent = 'Signing in…';
    try {
      const res = await fetchJSON(API_URL, { action: 'login', email: f.email.value.trim().toLowerCase(), password: f.password.value });
      if (!res.ok) throw new Error(res.error || 'Login failed');
      saveSession(res.data.token, res.data.user);
      state.view = 'dashboard'; state.params = {};
      await preloadAll();
      render();
    } catch (err) {
      showMsg(err.message || 'Login failed', 'bad');
      btn.disabled = false; btn.textContent = 'Sign in';
    }
  });

  $('#registerForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const f = e.target;
    const btn = f.querySelector('button[type=submit]');
    btn.disabled = true; btn.textContent = 'Creating…';
    try {
      const res = await fetchJSON(API_URL, {
        action: 'register', name: f.name.value.trim(),
        email: f.email.value.trim().toLowerCase(), password: f.password.value
      });
      if (!res.ok) throw new Error(res.error || 'Registration failed');
      showMsg('Account created. You can now sign in.', 'ok');
      f.reset();
      $$('[data-auth-tab]').forEach(x => x.classList.toggle('active', x.dataset.authTab === 'login'));
      $('#loginForm').classList.remove('hidden'); f.classList.add('hidden');
    } catch (err) {
      showMsg(err.message || 'Registration failed', 'bad');
      btn.disabled = false; btn.textContent = 'Create account';
    }
  });

  $('#forgotLink').addEventListener('click', async (e) => {
    e.preventDefault();
    const email = prompt('Enter your account email:'); if (!email) return;
    try {
      const res = await fetchJSON(API_URL, { action: 'forgot', email: email.trim().toLowerCase() });
      if (!res.ok) throw new Error(res.error || 'Request failed');
      let text = res.data.message;
      if (res.data.code) text += ' Code: ' + res.data.code;
      const code = prompt(text + '\n\nEnter the reset code:');
      if (!code) return;
      const pw = prompt('Enter your new password (min 8 chars):');
      if (!pw) return;
      const r2 = await fetchJSON(API_URL, { action: 'reset', email: email.trim().toLowerCase(), code: code.trim(), password: pw });
      if (!r2.ok) throw new Error(r2.error || 'Reset failed');
      showMsg('Password reset. Please sign in.', 'ok');
    } catch (err) { showMsg(err.message || 'Reset failed', 'bad'); }
  });
}

/* ---------- Module View (Left Outline + Prev/Next across Lessons, Quiz, and Modules) ---------- */
async function renderModule(app, moduleId) {
  app.innerHTML = `<div class="card"><p class="small">Loading module…</p></div>`;
  const content = await ensureContent();
  if (!content || !content.modules) {
    app.innerHTML = `<div class="msg bad">Module content unavailable.</div>`;
    return;
  }
  const sortedMods = content.modules.slice().sort((a, b) => Number(a.SortOrder) - Number(b.SortOrder));
  const modIdx = sortedMods.findIndex(m => String(m.ModuleID) === String(moduleId));
  const mod = modIdx >= 0 ? sortedMods[modIdx] : null;
  if (!mod) { app.innerHTML = `<div class="msg bad">Module not found.</div>`; return; }

  const lessons = (mod.Lessons || []).slice().sort((a, b) => Number(a.SortOrder) - Number(b.SortOrder));
  const hasQuiz = (mod.Quizzes || []).length > 0;

  // Build ordered steps within this module: lessons..., optional QUIZ
  const steps = lessons.map(l => ({ type: 'lesson', id: l.LessonID, title: l.Title, lesson: l }));
  if (hasQuiz) steps.push({ type: 'quiz', id: 'QUIZ', title: '📝 Module quiz' });

  let currentId = state.params.lessonId || (steps[0] && steps[0].id) || '';
  let stepIdx = steps.findIndex(s => String(s.id) === String(currentId));
  if (stepIdx < 0) stepIdx = 0;
  const activeStep = steps[stepIdx] || null;
  if (activeStep) state.params.lessonId = activeStep.id;

  const prevMod = modIdx > 0 ? sortedMods[modIdx - 1] : null;
  const nextMod = modIdx < sortedMods.length - 1 ? sortedMods[modIdx + 1] : null;

  let navHtml = `<h4>${esc(mod.Title)}</h4>`;
  steps.forEach((st, idx) => {
    navHtml += `<a data-step-idx="${idx}" class="${idx === stepIdx ? 'active' : ''}">${esc(st.title)}</a>`;
  });

  let mainHtml = '';
  if (!activeStep) {
    mainHtml = `<div class="msg info">No lessons or quizzes in this module yet.</div>`;
  } else if (activeStep.type === 'quiz') {
    mainHtml = await renderQuizView(mod);
  } else {
    mainHtml = `<h2>${esc(activeStep.lesson.Title)}</h2><div class="lesson-content">${activeStep.lesson.ContentHTML}</div>`;
  }

  const hasPrevStep = stepIdx > 0;
  const hasNextStep = stepIdx < steps.length - 1;

  mainHtml += `
    <div class="lesson-actions">
      <div class="flex-row">
        <button class="btn ghost" id="prevStepBtn" ${hasPrevStep ? '' : 'disabled'}>← Previous</button>
        <button class="btn primary" id="nextStepBtn" ${hasNextStep ? '' : 'disabled'}>Next →</button>
      </div>
      <div class="flex-row">
        ${prevMod ? `<button class="btn ghost btn-sm" id="prevModBtn">⇐ Prev Module</button>` : ''}
        ${nextMod ? `<button class="btn ghost btn-sm" id="nextModBtn">Next Module ⇒</button>` : ''}
      </div>
    </div>
  `;

  app.innerHTML = `
    <div class="space-between" style="margin-bottom:1rem">
      <button class="btn ghost btn-sm" data-nav="dashboard">← All modules</button>
      <span class="small">Step ${steps.length ? stepIdx + 1 : 0} of ${steps.length}</span>
    </div>
    <div class="lesson-wrap">
      <aside class="lesson-nav">${navHtml}</aside>
      <div class="lesson-main">${mainHtml}</div>
    </div>
  `;

  $$('.lesson-nav a[data-step-idx]').forEach(a => {
    a.addEventListener('click', () => {
      const idx = Number(a.dataset.stepIdx);
      if (steps[idx]) { state.params.lessonId = steps[idx].id; renderModule(app, mod.ModuleID); window.scrollTo({ top: 0, behavior: 'smooth' }); }
    });
  });
  $('#prevStepBtn')?.addEventListener('click', () => {
    if (stepIdx > 0) { state.params.lessonId = steps[stepIdx - 1].id; renderModule(app, mod.ModuleID); window.scrollTo({ top: 0, behavior: 'smooth' }); }
  });
  $('#nextStepBtn')?.addEventListener('click', () => {
    if (stepIdx < steps.length - 1) { state.params.lessonId = steps[stepIdx + 1].id; renderModule(app, mod.ModuleID); window.scrollTo({ top: 0, behavior: 'smooth' }); }
  });
  $('#prevModBtn')?.addEventListener('click', () => {
    state.params = { moduleId: prevMod.ModuleID, lessonId: '' }; renderModule(app, prevMod.ModuleID); window.scrollTo({ top: 0, behavior: 'smooth' });
  });
  $('#nextModBtn')?.addEventListener('click', () => {
    state.params = { moduleId: nextMod.ModuleID, lessonId: '' }; renderModule(app, nextMod.ModuleID); window.scrollTo({ top: 0, behavior: 'smooth' });
  });

  bindLessonInteractions();
}

function bindLessonInteractions() {
  $$('[data-note-key]').forEach(ta => { if (state.userData[ta.dataset.noteKey]) ta.value = state.userData[ta.dataset.noteKey]; });
  $$('[data-check-key]').forEach(cb => { cb.checked = !!state.userData[cb.dataset.checkKey]; });
}

/* ---------- Quiz View ---------- */
async function renderQuizView(mod) {
  let banner = '';
  let prevAttempt = null;
  const remote = await apiCall('getQuizGroupScore', { moduleId: mod.ModuleID });
  if (remote.ok && remote.data && remote.data.attempt) prevAttempt = remote.data.attempt;
  const local = (await kvGet('quizLocal')) || {};
  if (local[mod.ModuleID]) {
    const l = local[mod.ModuleID];
    if (!prevAttempt || Number(l.percentage) >= Number(prevAttempt.percentage)) prevAttempt = l;
  }
  if (prevAttempt) {
    banner = `<div class="msg info">Previous attempt: <strong>${prevAttempt.percentage}%</strong> (${prevAttempt.score}/${prevAttempt.total}) · attempt #${prevAttempt.attemptCount}</div>`;
  }
  const quizzes = mod.Quizzes || [];
  let html = `${banner}<h2>${esc(mod.Title)} — Module quiz</h2>
    <p class="small">Answer every question, then submit. Correct answers and explanations appear after submission.</p>
    <div id="quizContainer">`;
  quizzes.forEach((q, qi) => {
    html += `<div class="quiz-q" data-quiz-id="${esc(q.QuizID)}"><div class="q-text">${qi + 1}. ${esc(q.Question)}</div>`;
    [q.OptionA, q.OptionB, q.OptionC, q.OptionD].forEach((opt, oi) => {
      html += `<label class="quiz-opt"><input type="radio" name="q${qi}" value="${oi}"><span>${esc(opt)}</span></label>`;
    });
    html += `</div>`;
  });
  html += `</div><button class="btn primary" data-quiz-submit="${esc(mod.ModuleID)}">Submit quiz</button><div id="quizResults" hidden></div>`;
  return html;
}

function renderQuizResults(data) {
  const box = $('#quizResults');
  const pct = Number(data.percentage);
  const cls = pct >= PASS_THRESHOLD ? 'ok' : 'bad';
  let html = `<div class="quiz-result ${cls}">Score: ${data.score}/${data.total} — <strong>${pct}%</strong> (attempt #${data.attemptCount})</div><div style="margin-top:1rem">`;
  (data.results || []).forEach((r, i) => {
    html += `<div class="quiz-q" style="margin-bottom:.75rem"><div class="q-text">${i + 1}. ${esc(r.question)}</div>`;
    (r.options || []).forEach((opt, j) => {
      const isChosen = j === r.chosenIndex;
      const isCorrect = j === r.correctIndex;
      const c = isCorrect ? 'correct' : (isChosen ? 'wrong' : '');
      html += `<div class="quiz-opt ${c}"><input type="radio" disabled ${isChosen ? 'checked' : ''}><span>${esc(opt)}</span></div>`;
    });
    if (r.explanation) html += `<div class="quiz-explain">💡 ${esc(r.explanation)}</div>`;
    html += `</div>`;
  });
  html += `</div>`;
  box.innerHTML = html; box.hidden = false;
  setTimeout(() => box.scrollIntoView({ behavior: 'smooth', block: 'start' }), 100);
}

    const btn = $('#pfUploadBtn'); btn.disabled = true; btn.textContent = 'Uploading…';
    try {
      const base64 = await new Promise((res, rej) => {
        const r = new FileReader();
        r.onload = () => res(String(r.result).substring(String(r.result).indexOf(',') + 1));
        r.onerror = rej;
        r.readAsDataURL(file);
      });
      const res = await apiCall('submitPortfolio', { moduleId, fileName: file.name, fileType: file.type || 'application/octet-stream', fileSizeBytes: file.size, fileBase64: base64 });
      if (!res.ok) throw new Error(res.error || 'Upload failed');
      status.innerHTML = '<div class="msg ok">Uploaded successfully.</div>';
      setTimeout(() => renderPortfolio(app), 700);
    } catch (err) {
      status.innerHTML = `<div class="msg bad">${esc(err.message)}</div>`;
      btn.disabled = false; btn.textContent = 'Upload portfolio';
    }
  });
}

/* =====================================================================

   ===================================================================== */
async function renderAdmin(app, tab) {

  tab = tab || (isAdmin() ? 'users' : 'grades');

  app.innerHTML = `

    <div class="tabs">
      ${isAdmin() ? `<button class="tab ${tab === 'users' ? 'active' : ''}" data-admin-tab="users">Users</button>` : ''}

      <button class="tab ${tab === 'content' ? 'active' : ''}" data-admin-tab="content">Modules &amp; lessons</button>
      <button class="tab ${tab === 'quizzes' ? 'active' : ''}" data-admin-tab="quizzes">Quizzes &amp; assessments</button>

            <td>${esc(u.Email)}</td>

              ${String(u.Email).toLowerCase() !== String(state.user.email).toLowerCase() ? `<button class="btn btn-sm danger" data-del-user="${esc(u.Email)}">Delete</button>` : ''}
            </td>
          </tr>`).join('')}</tbody>

            <td>${g.modulesAttempted}/${g.modulesTotal}</td>

        g.quizAverage, g.osce ? g.osce.percentage : '', g.finalPercentage, g.portfolio.count

    $('#openOsceModalBtn')?.addEventListener('click', () => {

        <h3>Record OSCE Assessment (20 Points)</h3>

    bodyEl.addEventListener('click', (e) => {

        </table></div>
        ${isAdmin() ? `

            </div>

      $('#overrideGradeForm')?.addEventListener('submit', async (ev) => {

        const f = ev.target;
        const r = await apiCall('adminUpdateModuleGrade', {
          learnerEmail: g.learnerEmail, moduleId: f.moduleId.value,
          score: Number(f.score.value), total: Number(f.total.value)
        });
        if (!r.ok) return toast(r.error || 'Failed', 'bad');
        toast(`Updated to ${r.data.percentage}%`, 'ok');
        closeModal(); renderAdmin(app, 'grades');
      });

  /* --- TAB 3: MODULES & LESSONS (Course Contents) --- */
  else if (tab === 'content') {
    const content = await ensureContent(true);
    const mods = (content && content.modules) || [];

    bodyEl.innerHTML = `
      <div class="card space-between">

            <div>

              <p class="small" style="margin:.25rem 0 0">${esc(m.Description || '')}</p>
            </div>
            <div class="flex-row">
              <button class="btn btn-sm ghost" data-edit-mod="${esc(m.ModuleID)}">Edit module</button>
              <button class="btn btn-sm danger" data-del-mod="${esc(m.ModuleID)}">Delete</button>
            </div>

          <div class="tbl-wrap" style="margin-top:.75rem"><table class="data">
            <thead><tr><th>Order</th><th>Lesson title</th><th>Actions</th></tr></thead>
            <tbody>${(m.Lessons || []).length ? (m.Lessons || []).map(l => `
              <tr>
                <td>${esc(l.SortOrder)}</td>
                <td>${esc(l.Title)}</td>
                <td class="flex-row">
                  <button class="btn btn-sm ghost" data-edit-lesson="${esc(l.LessonID)}" data-mod-id="${esc(m.ModuleID)}">Edit</button>
                  <button class="btn btn-sm danger" data-del-lesson="${esc(l.LessonID)}">Delete</button>
                </td>
              </tr>`).join('') : '<tr><td colspan="3" class="small">No lessons in this module.</td></tr>'}</tbody>
          </table></div>
        </div>
      `).join('')}
    `;

    $('#addModuleBtn')?.addEventListener('click', () => {
      openModal(`
        <h3>Add Module</h3>

          </form>

        $('#editModForm').addEventListener('submit', async (ev) => {
          ev.preventDefault();
          const f = ev.target;
          const r = await apiCall('updateModule', { moduleId: m.ModuleID, title: f.title.value, description: f.description.value, sortOrder: Number(f.sortOrder.value) });

          toast('Module updated', 'ok'); closeModal(); renderAdmin(app, 'content');

      const delMod = e.target.closest('button[data-del-mod]');
      if (delMod) {
        if (!confirm('Delete this module and all its lessons and quizzes?')) return;
        const r = await apiCall('deleteModule', { moduleId: delMod.dataset.delMod });
        if (!r.ok) return toast(r.error || 'Failed', 'bad');
        toast('Module deleted', 'ok'); renderAdmin(app, 'content');
        return;
      }

      const editLesson = e.target.closest('button[data-edit-lesson]');
      if (editLesson) {
        const m = mods.find(x => String(x.ModuleID) === String(editLesson.dataset.modId));
        const l = (m?.Lessons || []).find(x => String(x.LessonID) === String(editLesson.dataset.editLesson));
        if (!l) return;
        openModal(`
          <h3>Edit Lesson</h3>
          <form id="editLessonForm">
            <label>Title<input name="title" value="${esc(l.Title)}" required></label>
            <label>Sort Order<input type="number" name="sortOrder" value="${esc(l.SortOrder)}" required></label>
            <label>Content HTML<textarea name="content" style="min-height:180px">${esc(l.ContentHTML || '')}</textarea></label>

    const quizFormModal = (existing) => {

        <form id="quizForm">
          ${!existing ? `<label>Module<select name="moduleId" required>${mods.map(m => `<option value="${esc(m.ModuleID)}" ${m.ModuleID === q.ModuleID ? 'selected' : ''}>${esc(m.Title)}</option>`).join('')}</select></label>` : ''}
          <label>Question<textarea name="question" required>${esc(q.Question)}</textarea></label>
          <label>Option A<input name="OptionA" value="${esc(q.OptionA)}" required></label>
          <label>Option B<input name="OptionB" value="${esc(q.OptionB)}" required></label>

              <option value="1" ${Number(q.CorrectIndex) === 1 ? 'selected' : ''}>B</option>
              <option value="2" ${Number(q.CorrectIndex) === 2 ? 'selected' : ''}>C</option>
              <option value="3" ${Number(q.CorrectIndex) === 3 ? 'selected' : ''}>D</option>
            </select>
          </label>
          <label>Explanation<textarea name="explanation">${esc(q.Explanation || '')}</textarea></label>
          <div class="flex-row" style="justify-content:flex-end">
            <button type="button" class="btn ghost" onclick="closeModal()">Cancel</button>
            <button type="submit" class="btn primary">Save</button>
          </div>
        </form>
      `);
      $('#quizForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const f = e.target;
        const payload = {
          question: f.question.value, OptionA: f.OptionA.value, OptionB: f.OptionB.value,
          OptionC: f.OptionC.value, OptionD: f.OptionD.value,
          correctIndex: Number(f.correctIndex.value), explanation: f.explanation.value
        };
        if (existing) { payload.quizId = existing.QuizID; }
        else { payload.moduleId = f.moduleId.value; }
        const r = await apiCall(existing ? 'updateQuiz' : 'createQuiz', payload);
        if (!r.ok) return toast(r.error || 'Failed', 'bad');
        toast(existing ? 'Quiz updated' : 'Quiz added', 'ok'); closeModal(); renderAdmin(app, 'quizzes');
      });
    };

    $('#addQuizBtn')?.addEventListener('click', () => {
      if (!mods.length) return toast('Create a module first', 'warn');
      quizFormModal(null);
    });

    bodyEl.addEventListener('click', async (e) => {
      const editBtn = e.target.closest('button[data-edit-quiz]');
      if (editBtn) {
        const q = allQuizzes.find(x => String(x.QuizID) === String(editBtn.dataset.editQuiz));
        if (q) quizFormModal(q);
        return;
      }
      const delBtn = e.target.closest('button[data-del-quiz]');
      if (delBtn) {
        if (!confirm('Delete this quiz question?')) return;
        const r = await apiCall('deleteQuiz', { quizId: delBtn.dataset.delQuiz });
        if (!r.ok) return toast(r.error || 'Failed', 'bad');
        toast('Quiz deleted', 'ok'); renderAdmin(app, 'quizzes');
      }
    });
  }
}

/* ---------- Global Event Delegation ---------- */
document.addEventListener('click', (e) => {
  const navBtn = e.target.closest('#mainNav button[data-nav]');
  if (navBtn) {
    state.view = navBtn.dataset.nav; state.params = {};
    $$('#mainNav button').forEach(b => b.classList.toggle('active', b === navBtn));
    render(); return;
  }
  const backBtn = e.target.closest('[data-nav]');
  if (backBtn && backBtn.dataset.nav) {
    state.view = backBtn.dataset.nav; state.params = {};
    $$('#mainNav button').forEach(b => b.classList.toggle('active', b.dataset.nav === backBtn.dataset.nav));
    render(); return;
  }
  const calcBtn = e.target.closest('[data-calc-check]');
  if (calcBtn) {
    const block = calcBtn.closest('.lesson-calc');
    const input = block.querySelector('input');
    const fb = block.querySelector('.calc-feedback');
    const answer = Number(block.dataset.answer);
    const tol = Number(block.dataset.tol) || 0.01;
    const val = Number(input.value);
    if (isNaN(val) || input.value === '') { fb.textContent = 'Enter a number'; fb.className = 'calc-feedback bad'; fb.hidden = false; return; }
    const ok = Math.abs(val - answer) <= tol;
    fb.textContent = ok ? '✓ Correct' : '✗ Try again. Solution: ' + (block.dataset.solution || answer);
    fb.className = 'calc-feedback ' + (ok ? 'ok' : 'bad');
    fb.hidden = false; return;
  }
  const submitQuizBtn = e.target.closest('[data-quiz-submit]');
  if (submitQuizBtn) {
    const moduleId = submitQuizBtn.dataset.quizSubmit;
    const answers = [];
    $$('#quizContainer .quiz-q').forEach(qEl => {
      const checked = qEl.querySelector('input[type=radio]:checked');
      if (checked) answers.push({ quizId: qEl.dataset.quizId, chosenIndex: Number(checked.value) });
    });
    if (!answers.length) { toast('Answer at least one question', 'warn'); return; }
    submitQuizBtn.disabled = true; const orig = submitQuizBtn.textContent; submitQuizBtn.textContent = 'Submitting…';
    apiCall('submitQuizGroup', { moduleId, answers }).then(res => {
      submitQuizBtn.disabled = false; submitQuizBtn.textContent = orig;
      if (res.ok) {
        renderQuizResults(res.data);
        toast(res.queued ? 'Saved offline — will sync when online' : 'Quiz submitted', res.queued ? 'warn' : 'ok');
      } else toast(res.error || 'Submit failed', 'bad');
    });
  }
});

document.addEventListener('input', debounce(async (e) => {
  const ta = e.target.closest('[data-note-key]');
  if (!ta) return;
  const key = ta.dataset.noteKey;
  state.userData[key] = ta.value;
  await kvSet('userData', state.userData);
  const res = await apiCall('saveUserData', { dataType: 'note', dataKey: key, dataValue: ta.value });
  const statusEl = document.querySelector(`[data-note-status="${key}"]`);
  if (statusEl) {
    statusEl.textContent = res.queued ? 'Saved locally · will sync' : (res.ok ? 'Saved ✓' : 'Save failed');
    statusEl.className = 'note-status ' + (res.ok ? 'ok' : 'bad');
  }
}, 700));

document.addEventListener('change', async (e) => {
  const cb = e.target.closest('[data-check-key]');
  if (!cb) return;
  const key = cb.dataset.checkKey;
  state.userData[key] = cb.checked ? '1' : '';
  await kvSet('userData', state.userData);
  await apiCall('saveUserData', { dataType: 'check', dataKey: key, dataValue: cb.checked ? '1' : '' });
});

document.getElementById('logoutBtn').addEventListener('click', async () => {
  try { await fetchJSON(API_URL, { action: 'logout', token: state.token }); } catch (e) {}
  clearSession(); state.view = 'login'; render();
});

async function boot() {
  updateNetBadge();
  await refreshPendingBadge();

  if (OFFLINE.ENABLED && OFFLINE.SERVICE_WORKER && 'serviceWorker' in navigator) {
    try {
      const reg = await navigator.serviceWorker.register(OFFLINE.SERVICE_WORKER);
      console.log('[LMS] SW registered:', reg.scope);
    } catch (e) { console.warn('[LMS] SW failed:', e.message); }
  }

  if (state.token) {
    const me = await apiCall('me', {});
    if (me.ok && me.data && me.data.user) state.user = me.data.user;
    else if (state.online) clearSession();
  }

  if (!state.token) state.view = 'login';
  else { state.view = 'dashboard'; await preloadAll(); }
  render();

  setInterval(ping, OFFLINE.PING_INTERVAL_MS);
  setInterval(flushQueue, OFFLINE.SYNC_INTERVAL_MS);
  ping();
}

window.addEventListener('online', async () => {
  state.online = true; updateNetBadge();
  await flushQueue();
  if (state.token) preloadAll().then(render);
});
window.addEventListener('offline', () => { state.online = false; updateNetBadge(); });
window.addEventListener('DOMContentLoaded', boot);
</script>
