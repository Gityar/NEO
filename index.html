<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Neonatal Nursing LMS</title>
<script src="config.js"></script>
<style>
:root{
  --ink:#0d1f26; --ink-soft:#35525d; --muted:#54707c;
  --brand:#0d7d76; --brand-600:#0a5f5a; --brand-50:#e7f4f3; --brand-100:#cfe9e6;
  --ok:#166534; --ok-50:#dcfce7; --bad:#b91c1c; --bad-50:#fee2e2;
  --warn:#b45309; --warn-50:#fef3e2;
  --bg:#eef5f5; --card:#fff; --line:#d3e3e6; --line-soft:#e8f1f2;
  --radius:12px; --shadow:0 1px 3px rgba(13,31,38,.08),0 8px 24px rgba(13,31,38,.04);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;background:var(--bg);color:var(--ink);line-height:1.55;font-size:15px}
a{color:var(--brand-600);text-decoration:none}
a:hover{text-decoration:underline}
button{font-family:inherit;font-size:14px;cursor:pointer}
h1,h2,h3,h4{color:var(--ink);margin:0 0 .5rem;line-height:1.25}
h1{font-size:1.6rem}h2{font-size:1.25rem}h3{font-size:1.1rem}h4{font-size:1rem}
p{margin:0 0 .75rem}
.small{font-size:.85rem;color:var(--muted)}
.hidden{display:none !important}
.flex-row{display:flex;gap:.5rem;flex-wrap:wrap;align-items:center}
.space-between{display:flex;justify-content:space-between;align-items:center;gap:.75rem;flex-wrap:wrap}

.topbar{position:sticky;top:0;z-index:100;background:var(--brand);color:#fff;padding:.75rem 1rem;display:flex;align-items:center;justify-content:space-between;gap:1rem;box-shadow:0 2px 8px rgba(0,0,0,.1)}
.brand{font-weight:700;font-size:1.05rem;letter-spacing:.01em}
.topbar-right{display:flex;align-items:center;gap:.5rem;flex-wrap:wrap}
.badge{display:inline-block;padding:.15rem .6rem;border-radius:999px;font-size:.72rem;font-weight:700;letter-spacing:.03em;background:rgba(255,255,255,.2);color:#fff}
.badge.ok{background:#1a7a4a}.badge.warn{background:#b45309}.badge.bad{background:#b91c1c}
.btn-ghost{background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.25);color:#fff;padding:.35rem .8rem;border-radius:8px;font-weight:600}
.btn-ghost:hover{background:rgba(255,255,255,.28)}

.mainnav{background:var(--card);border-bottom:1px solid var(--line);padding:.35rem 1rem;display:flex;gap:.25rem;overflow-x:auto}
.mainnav button{background:transparent;border:1px solid transparent;border-radius:8px;padding:.5rem .9rem;font-weight:600;color:var(--ink-soft);white-space:nowrap}
.mainnav button.active{background:var(--brand-50);color:var(--brand-600);border-color:var(--brand-100)}
.mainnav button:hover{background:var(--line-soft)}

main#app{max-width:1140px;margin:1.25rem auto;padding:0 1rem}

.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:1.25rem;margin-bottom:1rem;box-shadow:var(--shadow)}
.grid{display:grid;gap:1rem;grid-template-columns:repeat(auto-fill,minmax(260px,1fr))}
.mod-card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:1rem;cursor:pointer;transition:transform .15s,border-color .15s}
.mod-card:hover{transform:translateY(-2px);border-color:var(--brand-100)}
.mod-card .mod-num{display:inline-block;background:var(--brand-50);color:var(--brand-600);padding:.15rem .55rem;border-radius:6px;font-weight:700;font-size:.78rem;margin-bottom:.35rem}
.mod-card h3{margin:.35rem 0}
.mod-card p{color:var(--muted);font-size:.9rem;margin:0}
.mod-card .mod-meta{margin-top:.55rem;font-size:.78rem;color:var(--muted)}

.btn{display:inline-block;padding:.6rem 1.1rem;border:1px solid transparent;border-radius:8px;font-weight:600;background:#e6eef0;color:var(--ink);transition:background .12s}
.btn:hover{background:#d8e3e6}
.btn.primary{background:var(--brand);color:#fff}
.btn.primary:hover{background:var(--brand-600)}
.btn.danger{background:#dc2626;color:#fff}
.btn.danger:hover{background:#b91c1c}
.btn.ghost{background:transparent;border-color:var(--line);color:var(--ink-soft)}
.btn.ghost:hover{background:var(--line-soft)}
.btn:disabled{opacity:.55;cursor:not-allowed}
.btn-sm{padding:.35rem .7rem;font-size:.83rem}
.btn-block{display:block;width:100%}

label{display:block;margin-bottom:.9rem;font-weight:600;font-size:.9rem}
input,textarea,select{display:block;width:100%;margin-top:.35rem;padding:.65rem .75rem;border:1px solid var(--line);border-radius:8px;font-size:1rem;font-family:inherit;background:#fff;color:var(--ink)}
input:focus,textarea:focus,select:focus{outline:2px solid var(--brand-100);outline-offset:0;border-color:var(--brand)}
textarea{resize:vertical;min-height:90px}
.form-card{max-width:420px;margin:2rem auto}
.form-title{margin-bottom:1rem}

.msg{padding:.75rem 1rem;border-radius:8px;margin-bottom:.75rem;font-size:.93rem}
.msg.ok{background:var(--ok-50);color:var(--ok);border:1px solid #86efac}
.msg.bad{background:var(--bad-50);color:var(--bad);border:1px solid #fca5a5}
.msg.warn{background:var(--warn-50);color:var(--warn);border:1px solid #fbbf24}
.msg.info{background:var(--brand-50);color:var(--brand-600);border:1px solid var(--brand-100)}

.lesson-wrap{display:flex;gap:1rem}
.lesson-nav{flex:0 0 250px;position:sticky;top:5rem;align-self:flex-start;max-height:calc(100vh - 6rem);overflow-y:auto;background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:.75rem}
.lesson-nav h4{font-size:.8rem;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);margin:.5rem 0 .4rem}
.lesson-nav a{display:block;padding:.45rem .6rem;border-radius:6px;color:var(--ink-soft);font-size:.9rem;margin-bottom:.15rem;cursor:pointer}
.lesson-nav a:hover{background:var(--line-soft)}
.lesson-nav a.active{background:var(--brand-50);color:var(--brand-600);font-weight:600}
.lesson-main{flex:1;min-width:0;background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:1.5rem;box-shadow:var(--shadow)}
.lesson-main .lesson-lead{font-size:1.05rem;color:var(--ink-soft)}
.lesson-main h3.lesson-h{color:var(--brand-600);margin-top:1.5rem;padding-bottom:.3rem;border-bottom:2px solid var(--brand-50)}
.lesson-callout{padding:.9rem 1.1rem;border-left:4px solid var(--brand);background:var(--brand-50);border-radius:6px;margin:1rem 0}
.lesson-cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:.75rem;margin:1rem 0}
.lesson-card{background:var(--brand-50);border:1px solid var(--brand-100);border-radius:8px;padding:.85rem}
.lesson-card .card-num{display:inline-block;background:var(--brand);color:#fff;width:24px;height:24px;text-align:center;border-radius:50%;font-weight:700;font-size:.78rem;line-height:24px;margin-bottom:.35rem}
.lesson-discuss{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:1rem;margin:1.25rem 0}
.note-status{font-size:.8rem;color:var(--muted);margin-top:.3rem;min-height:1.1rem}
.note-status.ok{color:var(--ok)}.note-status.bad{color:var(--bad)}
.lesson-actions{display:flex;justify-content:space-between;align-items:center;gap:.75rem;margin-top:1.5rem;padding-top:1rem;border-top:1px solid var(--line);flex-wrap:wrap}

.quiz-q{margin-bottom:1.15rem;padding-bottom:.85rem;border-bottom:1px solid var(--line-soft)}
.quiz-q .q-text{font-weight:600;margin-bottom:.5rem}
.quiz-opt{display:flex;align-items:flex-start;gap:.5rem;padding:.5rem .7rem;border:1px solid var(--line);border-radius:8px;margin-bottom:.35rem;cursor:pointer;background:#fff}
.quiz-opt input{width:auto;margin:0;flex-shrink:0;margin-top:.2rem}
.quiz-opt.correct{border-color:var(--ok);background:var(--ok-50)}
.quiz-opt.wrong{border-color:var(--bad);background:var(--bad-50)}
.quiz-explain{background:var(--brand-50);padding:.55rem .75rem;border-radius:6px;margin-top:.45rem;font-size:.88rem}
.quiz-result{padding:.75rem 1rem;border-radius:8px;margin-top:1rem;font-weight:600}
.quiz-result.ok{background:var(--ok-50);color:var(--ok)}
.quiz-result.bad{background:var(--bad-50);color:var(--bad)}

.osce-domain-card{border:1px solid var(--line);border-radius:10px;padding:.9rem 1rem;margin-bottom:.85rem;background:#fafdfd}
.osce-rubric-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:.5rem;margin:.6rem 0}
.rubric-box{border:1px solid var(--line);border-radius:8px;padding:.55rem .65rem;background:#fff;font-size:.82rem}
.rubric-box strong{display:block;margin-bottom:.2rem}

.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:8px;background:var(--card)}
table.data{width:100%;border-collapse:collapse;font-size:.9rem}
table.data th,table.data td{padding:.55rem .75rem;text-align:left;border-bottom:1px solid var(--line-soft);vertical-align:top}
table.data th{background:var(--line-soft);font-size:.78rem;text-transform:uppercase;letter-spacing:.04em;color:var(--ink-soft)}
table.data tr:last-child td{border-bottom:none}

.tabs{display:flex;gap:.25rem;border-bottom:1px solid var(--line);margin-bottom:1rem;overflow-x:auto}
.tab{background:transparent;border:1px solid transparent;border-bottom:none;padding:.55rem .9rem;font-weight:600;color:var(--muted);border-radius:8px 8px 0 0;white-space:nowrap}
.tab.active{background:var(--card);border-color:var(--line);color:var(--brand-600);margin-bottom:-1px}

.modal-backdrop{position:fixed;inset:0;background:rgba(13,31,38,.45);display:flex;align-items:center;justify-content:center;padding:1rem;z-index:500}
.modal-card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:1.25rem;width:100%;max-width:740px;max-height:90vh;overflow-y:auto;box-shadow:0 12px 32px rgba(0,0,0,.22)}

.toast{position:fixed;bottom:1rem;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:.7rem 1.2rem;border-radius:8px;box-shadow:0 4px 20px rgba(0,0,0,.2);z-index:1000;font-size:.9rem;max-width:90vw}
.toast.ok{background:var(--ok)}.toast.bad{background:var(--bad)}.toast.warn{background:var(--warn)}
.offline-banner{background:var(--warn);color:#fff;text-align:center;padding:.5rem 1rem;font-weight:600;font-size:.9rem}

@media(max-width:760px){
  .lesson-wrap{flex-direction:column}
  .lesson-nav{position:static;flex:none;max-height:none}
  .topbar{padding:.55rem .75rem;flex-wrap:wrap}
  main#app{margin:.75rem auto;padding:0 .75rem}
}
</style>
</head>
<body>

<header class="topbar">
  <div class="brand" id="brandLabel">Neonatal Nursing LMS</div>
  <div class="topbar-right">
    <span class="badge ok" id="netBadge">Online</span>
    <span class="badge warn hidden" id="pendingBadge">0 queued</span>
    <span class="small hidden" style="color:#e6f4f3" id="userName"></span>
    <button class="btn-ghost hidden" id="logoutBtn">Log out</button>
  </div>
</header>

<nav class="mainnav hidden" id="mainNav">
  <button data-nav="dashboard" class="active">Learn</button>
  <button data-nav="exams">Exams (30 / 40)</button>
  <button data-nav="grades">My grades</button>
  <button data-nav="certificates">Certificates</button>
  <button data-nav="portfolio">Portfolio</button>
  <button data-nav="admin" id="adminNavBtn" class="hidden">Admin</button>
</nav>

<div id="offlineBanner" class="offline-banner hidden">⚠ You are offline — cached content &amp; queued updates active.</div>

<main id="app"></main>
<div id="modalRoot" class="hidden"></div>
<div id="toast" class="toast hidden"></div>

<script>
const CFG = window.LMS_CONFIG || {};
const API_URL = CFG.API_URL || '';
const COURSE_TITLE = CFG.COURSE_TITLE || 'Neonatal Nursing';
const PASS_THRESHOLD = Number(CFG.PASS_THRESHOLD) || 80;
const EXAMS_CFG = Object.assign({
  MIDTERM_TITLE: 'Midterm Theory Examination (30 MCQs)',
  FINAL_TITLE: 'Final Comprehensive Examination (40 MCQs)',
  MIDTERM_PASSCODE: 'MIDTERM2026',
  FINAL_PASSCODE: 'FINAL2026'
}, CFG.EXAMS || {});
const OFFLINE = Object.assign({
  ENABLED: true, SERVICE_WORKER: 'sw.js', CACHE_VERSION: 'lms-v4',
  QUEUE_MAX_ITEMS: 200, QUEUE_MAX_RETRIES: 5, SYNC_BATCH_SIZE: 25,
  SYNC_INTERVAL_MS: 30000, PING_INTERVAL_MS: 60000
}, CFG.OFFLINE || {});

/* =====================================================================
   10-DOMAIN OSCE RUBRIC (Explicit Behavioral Anchors for Unbiased Scoring)
   ===================================================================== */
const OSCE_DOMAINS = [
  {
    num: 1,
    title: 'Preparation & Infection Control',
    objective: 'Environment readiness, equipment check, hand hygiene, and clean/sterile precautions before handling.',
    s0: 'Skips hand hygiene/equipment check or creates contamination/thermal hazard.',
    s1: 'Performs partial prep or minor delay in checking suction/bag/warmer or hygiene.',
    s2: 'Completes full hand hygiene, PPE/asepsis, and verifies warmer, bag/mask, suction, and O2 promptly.'
  },
  {
    num: 2,
    title: 'Initial Thermal & Airway Management',
    objective: 'Immediate drying, removal of wet linen, hat/warmer use, sniffing position, and selective airway clearance.',
    s0: 'Leaves infant wet/unwarmed or hyperextends/flexes neck obstructing airway.',
    s1: 'Applies warmth or positioning with minor delay or unnecessary routine suctioning.',
    s2: 'Dries immediately, removes wet linen, warms/hat, places in neutral sniffing position, suctions only if indicated.'
  },
  {
    num: 3,
    title: 'Rapid Assessment & APGAR Evaluation',
    objective: 'Immediate evaluation of term status, tone, breathing/crying, heart rate, and accurate APGAR scoring.',
    s0: 'Delays care for APGAR or misjudges apnoea/bradycardia (< 100 bpm).',
    s1: 'Assesses key signs but states findings late or inconsistently.',
    s2: 'Rapidly evaluates tone, breathing, and HR; initiates action immediately without delaying for APGAR.'
  },
  {
    num: 4,
    title: 'Positive Pressure Ventilation (PPV) Execution',
    objective: 'Timely PPV initiation within the Golden Minute, proper mask seal, rate (40–60/min), and chest rise check.',
    s0: 'Fails to start PPV when indicated or delivers erratic/unsafe ventilation.',
    s1: 'Starts PPV late (> 60 s) or seal/rate needs prompt adjustment.',
    s2: 'Initiates PPV within 60 s at 40–60 breaths/min with good seal and visible gentle chest rise.'
  },
  {
    num: 5,
    title: 'Corrective Ventilation Steps (MR. SOPA)',
    objective: 'Systematic troubleshooting when chest does not rise: Mask, Reposition, Suction, Open mouth, Pressure, Alternative airway.',
    s0: 'Random/unstructured troubleshooting or escalates to compressions without achieving chest rise.',
    s1: 'Applies some MR. SOPA steps out of sequence or omits one check.',
    s2: 'Executes MR. SOPA systematically in order until chest rises effectively.'
  },
  {
    num: 6,
    title: 'Chest Compressions (3:1 Ratio)',
    objective: 'Initiation when HR < 60 bpm after effective ventilation; correct thumb placement, depth (~1/3 AP), and 3:1 cadence.',
    s0: 'Starts compressions with HR ≥ 60 bpm without adequate PPV, or wrong technique.',
    s1: 'Correct indication, but minor rhythm/coordination lapse during 3:1 cycles.',
    s2: 'Starts at HR < 60 bpm with 100% O2; maintains accurate 3:1 ratio (120 events/min) and depth.'
  },
  {
    num: 7,
    title: 'Medication Preparation & Administration',
    objective: 'Accurate weight-based dose calculation (e.g., epinephrine 0.02 mg/kg), concentration check, closed-loop verification, and route.',
    s0: 'Calculation error, wrong concentration/route, or unverified high-alert drug.',
    s1: 'Correct dose but slow double-check or minor documentation lag.',
    s2: 'Calculates accurately, verifies concentration/dose aloud with second check, and administers safely.'
  },
  {
    num: 8,
    title: 'Team Communication & Closed-Loop Practice',
    objective: 'Clear role allocation, call-outs of HR/SpO2/interventions, and explicit read-back/closed-loop confirmation.',
    s0: 'Silent/chaotic team behavior or unacknowledged critical orders.',
    s1: 'Communicates intermittently; occasional missing read-back.',
    s2: 'Uses clear, calm, closed-loop communication and timely status call-outs throughout.'
  },
  {
    num: 9,
    title: 'Documentation & Timekeeping',
    objective: 'Accurate recording of birth/intervention times, HR/SpO2 trends, medications, and post-resuscitation status.',
    s0: 'Missing critical times/medications or inaccurate record.',
    s1: 'Records most events accurately with minor omissions.',
    s2: 'Tracks time intervals accurately and documents interventions, responses, and vitals clearly.'
  },
  {
    num: 10,
    title: 'Professionalism, Safety & Family Communication',
    objective: 'Safe handling, calm demeanor, ethical care, and empathetic, clear updates to parents/family.',
    s0: 'Unsafe handling, disrespectful tone, or no communication with family.',
    s1: 'Safe care overall; family update brief or delayed.',
    s2: 'Demonstrates calm professionalism, safety vigilance, and compassionate, clear family communication.'
  }
];

const $  = (s, el) => (el || document).querySelector(s);
const $$ = (s, el) => Array.from((el || document).querySelectorAll(s));
const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' })[c]);
const uid = () => (crypto.randomUUID ? crypto.randomUUID() : 'u_' + Math.random().toString(36).slice(2) + Date.now().toString(36));
function toast(msg, kind) {
  const el = $('#toast'); el.textContent = msg;
  el.className = 'toast ' + (kind || '');
  el.hidden = false;
  clearTimeout(toast._t); toast._t = setTimeout(() => { el.hidden = true; }, 2800);
}
function debounce(fn, ms) {
  let t; return function() { const a = arguments, c = this; clearTimeout(t); t = setTimeout(() => fn.apply(c, a), ms); };
}
function closeModal() {
  const mr = $('#modalRoot'); mr.innerHTML = ''; mr.classList.add('hidden');
}
function openModal(html) {
  const mr = $('#modalRoot');
  mr.innerHTML = `<div class="modal-backdrop" id="modalBackdrop"><div class="modal-card">${html}</div></div>`;
  mr.classList.remove('hidden');
  $('#modalBackdrop').addEventListener('click', (e) => { if (e.target.id === 'modalBackdrop') closeModal(); });
}

/* ---------- IndexedDB ---------- */
const DB_NAME = 'lms_offline';
const DB_VERSION = 2;
let _dbPromise = null;
function dbOpen() {
  if (_dbPromise) return _dbPromise;
  _dbPromise = new Promise((resolve, reject) => {
    const req = indexedDB.open(DB_NAME, DB_VERSION);
    req.onupgradeneeded = (e) => {
      const db = e.target.result;
      if (!db.objectStoreNames.contains('kv'))      db.createObjectStore('kv',      { keyPath: 'key' });
      if (!db.objectStoreNames.contains('pending')) db.createObjectStore('pending', { keyPath: 'id' });
    };
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
  return _dbPromise;
}
async function idbPut(store, val) {
  const db = await dbOpen();
  return new Promise((res, rej) => {
    const tx = db.transaction(store, 'readwrite');
    tx.objectStore(store).put(val);
    tx.oncomplete = () => res(); tx.onerror = () => rej(tx.error);
  });
}
async function idbGet(store, key) {
  const db = await dbOpen();
  return new Promise((res, rej) => {
    const tx = db.transaction(store, 'readonly');
    const req = tx.objectStore(store).get(key);
    req.onsuccess = () => res(req.result || null); req.onerror = () => rej(req.error);
  });
}
async function idbAll(store) {
  const db = await dbOpen();
  return new Promise((res, rej) => {
    const tx = db.transaction(store, 'readonly');
    const req = tx.objectStore(store).getAll();
    req.onsuccess = () => res(req.result || []); req.onerror = () => rej(req.error);
  });
}
async function idbDel(store, key) {
  const db = await dbOpen();
  return new Promise((res, rej) => {
    const tx = db.transaction(store, 'readwrite');
    tx.objectStore(store).delete(key);
    tx.oncomplete = () => res(); tx.onerror = () => rej(tx.error);
  });
}
const kvGet = (k)    => idbGet('kv', k).then(r => r ? r.val : null);
const kvSet = (k, v) => idbPut('kv', { key: k, val: v, at: Date.now() });

const state = {
  token: localStorage.getItem('lms_token') || '',
  user:  safeJSON(localStorage.getItem('lms_user')) || null,
  view:  'loading',
  params: {},
  content: null,
  userData: {},
  online: navigator.onLine,
  pendingCount: 0
};
function safeJSON(s) { try { return s ? JSON.parse(s) : null; } catch { return null; } }
function fetchJSON(url, body) {
  return fetch(url, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(body) })
    .then(r => { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); });
}

const READ_ACTIONS = new Set([
  'me', 'listContent', 'getQuizGroupScore', 'getUserData',
  'listMyPortfolio', 'listUsers', 'listAllGrades',
  'listCertificates', 'computeLearnerGrade', 'getMyExamSummary',
  'listExamQuestionsAdmin', 'ping'
]);
const WRITE_ACTIONS = new Set([
  'saveUserData', 'submitQuizGroup', 'submitExam', 'updateUser', 'deleteUser', 'adminCreateUser',
  'createModule', 'updateModule', 'deleteModule',
  'createLesson', 'updateLesson', 'deleteLesson',
  'createQuiz', 'updateQuiz', 'deleteQuiz',
  'createExamQuestion', 'updateExamQuestion', 'deleteExamQuestion',
  'submitOsce', 'adminUpdateModuleGrade', 'submitPortfolio'
]);
const ONLINE_ONLY = new Set([
  'login', 'logout', 'register', 'forgot', 'reset', 'verifyExamPasscode',
  'submitPortfolio', 'updateUser', 'deleteUser', 'adminCreateUser',
  'createModule', 'updateModule', 'deleteModule',
  'createLesson', 'updateLesson', 'deleteLesson',
  'createQuiz', 'updateQuiz', 'deleteQuiz',
  'createExamQuestion', 'updateExamQuestion', 'deleteExamQuestion',
  'submitOsce', 'adminUpdateModuleGrade'
]);

function cacheKey(action, body) {
  const b = Object.assign({}, body || {}); delete b.token;
  return 'cache:' + action + ':' + JSON.stringify(b, Object.keys(b).sort());
}

async function apiCall(action, body, opts) {
  opts = opts || {};
  const payload = Object.assign({}, body || {}, { action, token: state.token });
  if (state.online && !opts.forceCache) {
    try {
      const res = await fetchJSON(API_URL, payload);
      if (res && res.ok) {
        if (READ_ACTIONS.has(action)) await kvSet(cacheKey(action, body), { data: res.data, at: Date.now() });
        return { ok: true, data: res.data, fromCache: false };
      }
      if (res && res.code === 401) clearSession();
      return { ok: false, error: (res && res.error) || 'Server error', code: res && res.code };
    } catch (netErr) {}
  }
  if (ONLINE_ONLY.has(action)) return { ok: false, error: 'This action requires an internet connection.', offline: true };
  if (READ_ACTIONS.has(action)) {
    const cached = await kvGet(cacheKey(action, body));
    if (cached && cached.data) return { ok: true, data: cached.data, fromCache: true };
    return { ok: false, error: 'Offline and no cached copy available.' };
  }
  if (WRITE_ACTIONS.has(action)) {
    const optimistic = await applyOptimisticLocal(action, body || {});
    await queueAction(action, body || {});
    return { ok: true, data: optimistic, queued: true, offline: true };
  }
  return { ok: false, error: 'Action not available offline: ' + action };
}

async function applyOptimisticLocal(action, body) {
  if (action === 'saveUserData') {
    state.userData[body.dataKey] = body.dataValue;
    await kvSet('userData', state.userData);
    return { message: 'Saved locally.', offline: true };
  }
  return { message: 'Queued.', offline: true };
}

async function queueAction(action, body) {
  const clean = Object.assign({}, body); delete clean.token; delete clean.action;
  const item = { id: uid(), action, body: clean, at: Date.now(), retries: 0 };
  const items = await idbAll('pending');
  if (items.length >= OFFLINE.QUEUE_MAX_ITEMS) {
    items.sort((a, b) => a.at - b.at);
    await idbDel('pending', items[0].id);
  }
  await idbPut('pending', item);
  await refreshPendingBadge();
}
async function refreshPendingBadge() {
  const items = await idbAll('pending');
  state.pendingCount = items.length;
  const badge = $('#pendingBadge');
  if (!items.length) badge.classList.add('hidden');
  else { badge.textContent = items.length + ' queued'; badge.classList.remove('hidden'); }
}
async function flushQueue() {
  if (!state.online || !state.token) return;
  const items = await idbAll('pending');
  if (!items.length) { await refreshPendingBadge(); return; }
  for (let i = 0; i < items.length; i += OFFLINE.SYNC_BATCH_SIZE) {
    const batch = items.slice(i, i + OFFLINE.SYNC_BATCH_SIZE);
    try {
      const res = await fetchJSON(API_URL, {
        action: 'syncBatch', token: state.token,
        items: batch.map(it => ({ clientId: it.id, action: it.action, body: it.body }))
      });
      if (!res || !res.ok || !res.data || !Array.isArray(res.data.results)) return;
      for (const r of res.data.results) {
        if (r.ok) await idbDel('pending', r.clientId);
        else {
          const item = await idbGet('pending', r.clientId);
          if (!item) continue;
          item.retries = (item.retries || 0) + 1;
          if (item.retries >= OFFLINE.QUEUE_MAX_RETRIES) await idbDel('pending', item.id);
          else await idbPut('pending', item);
        }
      }
    } catch (e) { break; }
  }
  await refreshPendingBadge();
}

function saveSession(token, user) {
  state.token = token; state.user = user;
  localStorage.setItem('lms_token', token);
  localStorage.setItem('lms_user', JSON.stringify(user));
}
function clearSession() {
  state.token = ''; state.user = null;
  localStorage.removeItem('lms_token');
  localStorage.removeItem('lms_user');
}
function isInstructorOrAdmin() { return state.user && (state.user.role === 'admin' || state.user.role === 'instructor'); }
function isAdmin() { return state.user && state.user.role === 'admin'; }

function updateNetBadge() {
  const badge = $('#netBadge'), banner = $('#offlineBanner');
  if (state.online) { badge.textContent = 'Online'; badge.className = 'badge ok'; banner.classList.add('hidden'); }
  else { badge.textContent = 'Offline'; badge.className = 'badge warn'; banner.classList.remove('hidden'); }
  $('#logoutBtn').classList.toggle('hidden', !state.token);
  $('#userName').classList.toggle('hidden', !state.user);
  if (state.user) $('#userName').textContent = state.user.name + ' · ' + state.user.role;
  $('#mainNav').classList.toggle('hidden', !state.token);
  $('#adminNavBtn').classList.toggle('hidden', !isInstructorOrAdmin());
}

async function ping() {
  if (!API_URL) return;
  try {
    const res = await fetchJSON(API_URL, { action: 'ping' });
    state.online = !!(res && res.ok);
  } catch (e) { state.online = false; }
  updateNetBadge();
  if (state.online && state.pendingCount > 0) await flushQueue();
}

async function preloadAll() {
  const [ud, co] = await Promise.all([
    apiCall('getUserData', { prefix: '' }),
    apiCall('listContent', {})
  ]);
  if (ud.ok && ud.data && ud.data.data) state.userData = Object.assign({}, ud.data.data, state.userData);
  const localUD = await kvGet('userData');
  if (localUD) state.userData = Object.assign({}, localUD, state.userData);
  if (co.ok && co.data) state.content = co.data;
}
async function ensureContent(forceRefresh) {
  if (!forceRefresh && state.content && state.content.modules) return state.content;
  const res = await apiCall('listContent', {});
  if (res.ok) { state.content = res.data; return state.content; }
  return state.content || null;
}

function render() {
  const app = $('#app');
  updateNetBadge();
  if (!state.token) return renderLogin(app);
  switch (state.view) {
    case 'dashboard':    return renderDashboard(app);
    case 'module':       return renderModule(app, state.params.moduleId);
    case 'exams':        return renderExams(app, state.params.examType);
    case 'grades':       return renderGrades(app);
    case 'certificates': return renderCertificates(app);
    case 'portfolio':    return renderPortfolio(app);
    case 'admin':        return renderAdmin(app, state.params.tab);
    default:             return renderDashboard(app);
  }
}

/* ---------- Login ---------- */
function renderLogin(app) {
  app.innerHTML = `
    <div class="form-card card">
      <h2 class="form-title">${esc(COURSE_TITLE)}</h2>
      <p class="small">Sign in, or create a new learner account.</p>
      <div class="tabs" style="margin-bottom:1rem">

        <button class="tab" data-auth-tab="register">Register</button>
      </div>
      <form id="loginForm">
        <label>Email<input type="email" name="email" required autocomplete="email"></label>
        <label>Password<input type="password" name="password" required autocomplete="current-password"></label>
        <button class="btn primary btn-block" type="submit">Sign in</button>
        <p class="small" style="margin-top:.75rem"><a href="#" id="forgotLink">Forgot password?</a></p>
      </form>
      <form id="registerForm" class="hidden">
        <label>Full name<input type="text" name="name" required autocomplete="name"></label>
        <label>Email<input type="email" name="email" required autocomplete="email"></label>
        <label>Password (min 8 chars)<input type="password" name="password" required minlength="8" autocomplete="new-password"></label>
        <button class="btn primary btn-block" type="submit">Create account</button>
      </form>
      <div id="authMsg"></div>
    </div>
  `;
  const showMsg = (text, kind) => { $('#authMsg').innerHTML = `<div class="msg ${kind}">${esc(text)}</div>`; };
  $$('[data-auth-tab]').forEach(b => b.addEventListener('click', () => {
    $$('[data-auth-tab]').forEach(x => x.classList.toggle('active', x === b));
    $('#loginForm').classList.toggle('hidden', b.dataset.authTab !== 'login');
    $('#registerForm').classList.toggle('hidden', b.dataset.authTab !== 'register');
    $('#authMsg').innerHTML = '';
  }));
  $('#loginForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const f = e.target; const btn = f.querySelector('button[type=submit]');
    btn.disabled = true; btn.textContent = 'Signing in…';
    try {
      const res = await fetchJSON(API_URL, { action: 'login', email: f.email.value.trim().toLowerCase(), password: f.password.value });
      if (!res.ok) throw new Error(res.error || 'Login failed');
      saveSession(res.data.token, res.data.user);
      state.view = 'dashboard'; state.params = {};
      await preloadAll(); render();
    } catch (err) {
      showMsg(err.message || 'Login failed', 'bad');
      btn.disabled = false; btn.textContent = 'Sign in';
    }
  });
  $('#registerForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const f = e.target; const btn = f.querySelector('button[type=submit]');
    btn.disabled = true; btn.textContent = 'Creating…';
    try {
      const res = await fetchJSON(API_URL, { action: 'register', name: f.name.value.trim(), email: f.email.value.trim().toLowerCase(), password: f.password.value });
      if (!res.ok) throw new Error(res.error || 'Registration failed');
      showMsg('Account created. You can now sign in.', 'ok'); f.reset();
    } catch (err) {
      showMsg(err.message || 'Registration failed', 'bad');
      btn.disabled = false; btn.textContent = 'Create account';
    }
  });
  $('#forgotLink').addEventListener('click', async (e) => {
    e.preventDefault();
    const email = prompt('Enter your account email:'); if (!email) return;
    try {
      const res = await fetchJSON(API_URL, { action: 'forgot', email: email.trim().toLowerCase() });
      if (!res.ok) throw new Error(res.error || 'Request failed');
      const code = prompt((res.data.message + (res.data.code ? ' Code: ' + res.data.code : '')) + '\n\nEnter the reset code:');
      if (!code) return;
      const pw = prompt('Enter your new password (min 8 chars):'); if (!pw) return;
      const r2 = await fetchJSON(API_URL, { action: 'reset', email: email.trim().toLowerCase(), code: code.trim(), password: pw });
      if (!r2.ok) throw new Error(r2.error || 'Reset failed');
      showMsg('Password reset. Please sign in.', 'ok');
    } catch (err) { showMsg(err.message || 'Reset failed', 'bad'); }
  });
}

/* ---------- Module View ---------- */
async function renderModule(app, moduleId) {
  app.innerHTML = `<div class="card"><p class="small">Loading module…</p></div>`;
  const content = await ensureContent();
  if (!content || !content.modules) { app.innerHTML = `<div class="msg bad">Module content unavailable.</div>`; return; }
  const sortedMods = content.modules.slice().sort((a, b) => Number(a.SortOrder) - Number(b.SortOrder));
  const modIdx = sortedMods.findIndex(m => String(m.ModuleID) === String(moduleId));
  const mod = modIdx >= 0 ? sortedMods[modIdx] : null;
  if (!mod) { app.innerHTML = `<div class="msg bad">Module not found.</div>`; return; }

  const lessons = (mod.Lessons || []).slice().sort((a, b) => Number(a.SortOrder) - Number(b.SortOrder));
  const hasQuiz = (mod.Quizzes || []).length > 0;
  const steps = lessons.map(l => ({ type: 'lesson', id: l.LessonID, title: l.Title, lesson: l }));
  if (hasQuiz) steps.push({ type: 'quiz', id: 'QUIZ', title: '📝 Module quiz' });

  let currentId = state.params.lessonId || (steps[0] && steps[0].id) || '';
  let stepIdx = steps.findIndex(s => String(s.id) === String(currentId));
  if (stepIdx < 0) stepIdx = 0;
  const activeStep = steps[stepIdx] || null;
  if (activeStep) state.params.lessonId = activeStep.id;

  const prevMod = modIdx > 0 ? sortedMods[modIdx - 1] : null;
  const nextMod = modIdx < sortedMods.length - 1 ? sortedMods[modIdx + 1] : null;

  let navHtml = `<h4>${esc(mod.Title)}</h4>`;
  steps.forEach((st, idx) => { navHtml += `<a data-step-idx="${idx}" class="${idx === stepIdx ? 'active' : ''}">${esc(st.title)}</a>`; });

  let mainHtml = '';
  if (!activeStep) mainHtml = `<div class="msg info">No lessons or quizzes in this module yet.</div>`;
  else if (activeStep.type === 'quiz') mainHtml = await renderQuizView(mod);
  else mainHtml = `<h2>${esc(activeStep.lesson.Title)}</h2><div class="lesson-content">${activeStep.lesson.ContentHTML}</div>`;

  mainHtml += `
    <div class="lesson-actions">
      <div class="flex-row">
        <button class="btn ghost" id="prevStepBtn" ${stepIdx > 0 ? '' : 'disabled'}>← Previous</button>
        <button class="btn primary" id="nextStepBtn" ${stepIdx < steps.length - 1 ? '' : 'disabled'}>Next →</button>
      </div>
      <div class="flex-row">
        ${prevMod ? `<button class="btn ghost btn-sm" id="prevModBtn">⇐ Prev Module</button>` : ''}
        ${nextMod ? `<button class="btn ghost btn-sm" id="nextModBtn">Next Module ⇒</button>` : ''}
      </div>
    </div>
  `;

  app.innerHTML = `
    <div class="space-between" style="margin-bottom:1rem">
      <button class="btn ghost btn-sm" data-nav="dashboard">← All modules</button>
      <span class="small">Step ${steps.length ? stepIdx + 1 : 0} of ${steps.length}</span>
    </div>
    <div class="lesson-wrap">
      <aside class="lesson-nav">${navHtml}</aside>
      <div class="lesson-main">${mainHtml}</div>
    </div>
  `;

  $$('.lesson-nav a[data-step-idx]').forEach(a => a.addEventListener('click', () => {
    const idx = Number(a.dataset.stepIdx);
    if (steps[idx]) { state.params.lessonId = steps[idx].id; renderModule(app, mod.ModuleID); window.scrollTo({ top: 0, behavior: 'smooth' }); }
  }));
  $('#prevStepBtn')?.addEventListener('click', () => { if (stepIdx > 0) { state.params.lessonId = steps[stepIdx - 1].id; renderModule(app, mod.ModuleID); window.scrollTo({ top: 0, behavior: 'smooth' }); } });
  $('#nextStepBtn')?.addEventListener('click', () => { if (stepIdx < steps.length - 1) { state.params.lessonId = steps[stepIdx + 1].id; renderModule(app, mod.ModuleID); window.scrollTo({ top: 0, behavior: 'smooth' }); } });
  $('#prevModBtn')?.addEventListener('click', () => { state.params = { moduleId: prevMod.ModuleID, lessonId: '' }; renderModule(app, prevMod.ModuleID); window.scrollTo({ top: 0, behavior: 'smooth' }); });
  $('#nextModBtn')?.addEventListener('click', () => { state.params = { moduleId: nextMod.ModuleID, lessonId: '' }; renderModule(app, nextMod.ModuleID); window.scrollTo({ top: 0, behavior: 'smooth' }); });

  $$('[data-note-key]').forEach(ta => { if (state.userData[ta.dataset.noteKey]) ta.value = state.userData[ta.dataset.noteKey]; });
}

async function renderQuizView(mod) {
  let banner = '';
  const remote = await apiCall('getQuizGroupScore', { moduleId: mod.ModuleID });
  if (remote.ok && remote.data && remote.data.attempt) {
    const a = remote.data.attempt;
    banner = `<div class="msg info">Previous attempt: <strong>${a.percentage}%</strong> (${a.score}/${a.total}) · attempt #${a.attemptCount}</div>`;
  }
  const quizzes = mod.Quizzes || [];
  let html = `${banner}<h2>${esc(mod.Title)} — Module quiz</h2><div id="quizContainer">`;
  quizzes.forEach((q, qi) => {
    html += `<div class="quiz-q" data-quiz-id="${esc(q.QuizID)}"><div class="q-text">${qi + 1}. ${esc(q.Question)}</div>`;
    [q.OptionA, q.OptionB, q.OptionC, q.OptionD].forEach((opt, oi) => {
      html += `<label class="quiz-opt"><input type="radio" name="q${qi}" value="${oi}"><span>${esc(opt)}</span></label>`;
    });
    html += `</div>`;
  });
  html += `</div><button class="btn primary" data-quiz-submit="${esc(mod.ModuleID)}">Submit quiz</button><div id="quizResults" hidden></div>`;
  return html;
}

   PASSWORD-PROTECTED MIDTERM (30 MCQs) & FINAL (40 MCQs) EXAMS

async function renderExams(app, selectedType) {
  const activeType = (selectedType === 'final') ? 'final' : 'midterm';
  const sumRes = await apiCall('getMyExamSummary', {});
  const summary = (sumRes.ok && sumRes.data && sumRes.data.exams) || {};

  app.innerHTML = `
    <h1>Course Examinations</h1>
    <p class="small">Both exams require an exam passcode issued by your instructor/administrator at exam time.</p>
    <div class="tabs">
      <button class="tab ${activeType === 'midterm' ? 'active' : ''}" data-exam-tab="midterm">${esc(EXAMS_CFG.MIDTERM_TITLE)}</button>
      <button class="tab ${activeType === 'final' ? 'active' : ''}" data-exam-tab="final">${esc(EXAMS_CFG.FINAL_TITLE)}</button>
    </div>
    <div id="examPanel"></div>
  `;

  $$('[data-exam-tab]').forEach(btn => btn.addEventListener('click', () => {
    state.params.examType = btn.dataset.examTab;
    renderExams(app, btn.dataset.examTab);
  }));

  const panel = $('#examPanel');
  const title = activeType === 'final' ? EXAMS_CFG.FINAL_TITLE : EXAMS_CFG.MIDTERM_TITLE;
  const requiredCount = activeType === 'final' ? 40 : 30;
  const prev = summary[activeType];

  panel.innerHTML = `
    <div class="card">
      <h3>${esc(title)}</h3>
      <p class="small">Format: ${requiredCount} multiple-choice questions · Pass mark: ${PASS_THRESHOLD}%</p>
      ${prev ? `<div class="msg info">Recorded score: <strong>${prev.percentage}%</strong> (${prev.score}/${prev.total}) · Attempt #${prev.attemptCount}</div>` : ''}
      <form id="unlockExamForm" class="flex-row" style="align-items:flex-end">
        <label style="flex:1;min-width:220px;margin:0">
          Enter Exam Passcode
          <input type="password" id="examPasscodeInput" required placeholder="Enter exam password">
        </label>
        <button type="submit" class="btn primary">Unlock ${requiredCount}-MCQ Exam</button>
      </form>
      <div id="examUnlockMsg" style="margin-top:.75rem"></div>
    </div>
    <div id="examQuestionsArea"></div>
  `;

  $('#unlockExamForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const passcode = $('#examPasscodeInput').value.trim();
    const msgEl = $('#examUnlockMsg');
    msgEl.innerHTML = `<div class="msg info">Verifying passcode and loading ${requiredCount} MCQs…</div>`;

    const res = await apiCall('verifyExamPasscode', { examType: activeType, passcode });
    if (!res.ok) {
      msgEl.innerHTML = `<div class="msg bad">${esc(res.error || 'Invalid passcode')}</div>`;
      return;
    }
    const questions = res.data.questions || [];
    msgEl.innerHTML = `<div class="msg ok">Exam unlocked (${questions.length} MCQs loaded).</div>`;

    $('#examQuestionsArea').innerHTML = `
      <div class="card">
        <h3>${esc(title)} — Questions (${questions.length})</h3>
        <div id="examQList">
          ${questions.map((q, qi) => `
            <div class="quiz-q" data-eq-id="${esc(q.QuestionID)}">
              <div class="q-text">${qi + 1}. ${esc(q.Question)}</div>
              ${[q.OptionA, q.OptionB, q.OptionC, q.OptionD].map((opt, oi) => `
                <label class="quiz-opt">
                  <input type="radio" name="eq_${qi}" value="${oi}">
                  <span><strong>${'ABCD'[oi]}.</strong> ${esc(opt)}</span>
                </label>
              `).join('')}
            </div>
          `).join('')}
        </div>
        <button class="btn primary" id="submitExamBtn">Submit ${esc(activeType.toUpperCase())} Exam</button>
        <div id="examResultBox" hidden></div>
      </div>
    `;

    $('#submitExamBtn').addEventListener('click', async () => {
      const answers = [];
      let unanswered = 0;
      $$('#examQList .quiz-q').forEach((qEl, qi) => {
        const checked = qEl.querySelector(`input[name="eq_${qi}"]:checked`);
        if (checked) answers.push({ questionId: qEl.dataset.eqId, chosenIndex: Number(checked.value) });
        else unanswered++;
      });
      if (unanswered > 0 && !confirm(`You have ${unanswered} unanswered question(s). Submit anyway?`)) return;

      const sBtn = $('#submitExamBtn'); sBtn.disabled = true; sBtn.textContent = 'Submitting…';
      const subRes = await apiCall('submitExam', { examType: activeType, passcode, answers });
      sBtn.disabled = false; sBtn.textContent = `Submit ${activeType.toUpperCase()} Exam`;

      if (!subRes.ok) { toast(subRes.error || 'Submission failed', 'bad'); return; }
      const d = subRes.data;
      const cls = Number(d.percentage) >= PASS_THRESHOLD ? 'ok' : 'bad';
      const rBox = $('#examResultBox');
      rBox.innerHTML = `
        <div class="quiz-result ${cls}">
          ${esc(title)} Result: <strong>${d.score}/${d.total} (${d.percentage}%)</strong> · Attempt #${d.attemptCount}
        </div>
        <div style="margin-top:1rem">
          ${(d.results || []).map((r, idx) => `
            <div class="quiz-q">
              <div class="q-text">${idx + 1}. ${esc(r.question)}</div>
              ${(r.options || []).map((opt, j) => {
                const clsOpt = j === r.correctIndex ? 'correct' : (j === r.chosenIndex ? 'wrong' : '');
                return `<div class="quiz-opt ${clsOpt}"><input type="radio" disabled ${j === r.chosenIndex ? 'checked' : ''}><span><strong>${'ABCD'[j]}.</strong> ${esc(opt)}</span></div>`;
              }).join('')}
              ${r.explanation ? `<div class="quiz-explain">💡 ${esc(r.explanation)}</div>` : ''}
            </div>
          `).join('')}
        </div>
      `;
      rBox.hidden = false;
      rBox.scrollIntoView({ behavior: 'smooth', block: 'start' });
    });
  });
}

/* ---------- Certificates & Portfolio ---------- */
async function renderCertificates(app) {
  app.innerHTML = `<div class="card"><p class="small">Loading certificates…</p></div>`;
  const res = await apiCall('listCertificates', {});
  if (!res.ok) { app.innerHTML = `<div class="msg bad">${esc(res.error || '')}</div>`; return; }
  const certs = res.data.certificates || [];
  app.innerHTML = `<h1>Certificates</h1>` + (certs.length
    ? `<div class="grid">${certs.map(c => `<div class="card"><h3>${esc(c.Name)}</h3><p class="small">Score: <strong>${c.Percentage}%</strong> · Code: <code>${esc(c.CertCode)}</code></p><p class="small">Assessor: ${esc(c.AssessorName || c.AssessorEmail || '—')}</p></div>`).join('')}</div>`
    : `<div class="msg info">No certificates issued yet.</div>`);
}

async function renderPortfolio(app) {
  app.innerHTML = `<div class="card"><p class="small">Loading portfolio…</p></div>`;
  const [contentRes, subsRes] = await Promise.all([ensureContent(), apiCall('listMyPortfolio', {})]);
  const submissions = (subsRes.ok && subsRes.data && subsRes.data.submissions) || [];
  const mods = (contentRes && contentRes.modules) || [];
  app.innerHTML = `
    <h1>Reflective portfolio</h1>
    <div class="card">
      <h3>New submission</h3>
      <label>Module<select id="pfModule">${mods.map(m => `<option value="${esc(m.ModuleID)}">${esc(m.Title)}</option>`).join('')}</select></label>
      <label>File<input type="file" id="pfFile" accept=".pdf,.doc,.docx,.jpg,.jpeg,.png"></label>
      <button class="btn primary" id="pfUploadBtn" ${state.online ? '' : 'disabled'}>Upload portfolio</button>
      <div id="pfStatus"></div>
    </div>
    <div class="card">
      <h3>Past submissions</h3>
      ${submissions.length ? `<div class="tbl-wrap"><table class="data"><thead><tr><th>Module</th><th>File</th><th>Status</th><th>Link</th></tr></thead><tbody>${submissions.map(s => `<tr><td>${esc(s.ModuleTitle)}</td><td>${esc(s.FileName)}</td><td>${esc(s.Status)}</td><td><a href="${esc(s.DriveURL)}" target="_blank" rel="noopener">Open</a></td></tr>`).join('')}</tbody></table></div>` : '<p class="small">No submissions yet.</p>'}
    </div>
  `;
  $('#pfUploadBtn')?.addEventListener('click', async () => {
    const file = $('#pfFile').files?.[0];
    if (!file) return toast('Select a file first', 'warn');
    const base64 = await new Promise((res, rej) => {
      const r = new FileReader();
      r.onload = () => res(String(r.result).substring(String(r.result).indexOf(',') + 1));
      r.onerror = rej; r.readAsDataURL(file);
    });
    const r = await apiCall('submitPortfolio', { moduleId: $('#pfModule').value, fileName: file.name, fileType: file.type || 'application/octet-stream', fileSizeBytes: file.size, fileBase64: base64 });
    if (!r.ok) return toast(r.error || 'Upload failed', 'bad');
    toast('Uploaded', 'ok'); renderPortfolio(app);
  });
}

  app.innerHTML = `

    <div class="tabs">
      ${isAdmin() ? `<button class="tab ${tab === 'users' ? 'active' : ''}" data-admin-tab="users">Users</button>` : ''}

      <button class="tab ${tab === 'content' ? 'active' : ''}" data-admin-tab="content">Modules &amp; lessons</button>
      <button class="tab ${tab === 'quizzes' ? 'active' : ''}" data-admin-tab="quizzes">Module quizzes</button>

            </td>

      </table></div>

    $('#addUserBtn')?.addEventListener('click', () => {
      openModal(`<h3>Create User</h3><form id="cuForm"><label>Name<input name="name" required></label><label>Email<input type="email" name="email" required></label><label>Password<input type="password" name="password" minlength="8" required></label><label>Role<select name="role"><option value="learner">learner</option><option value="instructor">instructor</option><option value="admin">admin</option></select></label><div class="flex-row" style="justify-content:flex-end"><button type="button" class="btn ghost" onclick="closeModal()">Cancel</button><button type="submit" class="btn primary">Create</button></div></form>`);

  else if (tab === 'grades') {

    const openQuizModal = (q) => {
      const item = q || { ModuleID: mods[0]?.ModuleID || '', Question: '', OptionA: '', OptionB: '', OptionC: '', OptionD: '', CorrectIndex: 0, Explanation: '' };
      openModal(`<h3>${q ? 'Edit Quiz' : 'Add Quiz'}</h3><form id="qForm">${!q ? `<label>Module<select name="moduleId">${mods.map(m => `<option value="${esc(m.ModuleID)}">${esc(m.Title)}</option>`).join('')}</select></label>` : ''}<label>Question<textarea name="question" required>${esc(item.Question)}</textarea></label><label>Option A<input name="OptionA" value="${esc(item.OptionA)}" required></label><label>Option B<input name="OptionB" value="${esc(item.OptionB)}" required></label><label>Option C<input name="OptionC" value="${esc(item.OptionC)}" required></label><label>Option D<input name="OptionD" value="${esc(item.OptionD)}" required></label><label>Correct<select name="correctIndex"><option value="0" ${Number(item.CorrectIndex)===0?'selected':''}>A</option><option value="1" ${Number(item.CorrectIndex)===1?'selected':''}>B</option><option value="2" ${Number(item.CorrectIndex)===2?'selected':''}>C</option><option value="3" ${Number(item.CorrectIndex)===3?'selected':''}>D</option></select></label><label>Explanation<input name="explanation" value="${esc(item.Explanation || '')}"></label><div class="flex-row" style="justify-content:flex-end"><button type="button" class="btn ghost" onclick="closeModal()">Cancel</button><button type="submit" class="btn primary">Save</button></div></form>`);
      $('#qForm').addEventListener('submit', async (e) => {
        e.preventDefault(); const f = e.target;
        const payload = { question: f.question.value, OptionA: f.OptionA.value, OptionB: f.OptionB.value, OptionC: f.OptionC.value, OptionD: f.OptionD.value, correctIndex: Number(f.correctIndex.value), explanation: f.explanation.value };
        if (q) payload.quizId = q.QuizID; else payload.moduleId = f.moduleId.value;
        const r = await apiCall(q ? 'updateQuiz' : 'createQuiz', payload);
        if (r.ok) { toast('Saved', 'ok'); closeModal(); renderAdmin(app, 'quizzes'); }
      });
    };
    $('#addQuizBtn')?.addEventListener('click', () => openQuizModal(null));
    bodyEl.addEventListener('click', async (e) => {
      const eb = e.target.closest('button[data-edit-quiz]'); if (eb) { const found = allQuizzes.find(x => String(x.QuizID) === String(eb.dataset.editQuiz)); if (found) openQuizModal(found); return; }
      const db = e.target.closest('button[data-del-quiz]'); if (db && confirm('Delete quiz?')) { const r = await apiCall('deleteQuiz', { quizId: db.dataset.delQuiz }); if (r.ok) { toast('Deleted', 'ok'); renderAdmin(app, 'quizzes'); } }
    });
  }

  else if (tab === 'exams') {
    const bankType = state.params.adminExamType === 'final' ? 'final' : 'midterm';
    const res = await apiCall('listExamQuestionsAdmin', { examType: bankType });
    const qs = (res.ok && res.data && res.data.questions) || [];
    bodyEl.innerHTML = `
      <div class="card space-between">
        <div class="flex-row">
          <button class="btn ${bankType === 'midterm' ? 'primary' : 'ghost'} btn-sm" id="bankMidBtn">Midterm (30 MCQs)</button>
          <button class="btn ${bankType === 'final' ? 'primary' : 'ghost'} btn-sm" id="bankFinBtn">Final (40 MCQs)</button>
          <span class="small">Loaded: <strong>${qs.length}</strong></span>
        </div>
        <button class="btn primary btn-sm" id="addExamQBtn">+ Add exam MCQ</button>
      </div>
      <div class="tbl-wrap"><table class="data"><thead><tr><th>#</th><th>Question</th><th>Ans</th><th>Actions</th></tr></thead><tbody>${qs.map((q, idx) => `
        <tr><td>${idx + 1}</td><td>${esc(q.Question)}</td><td><strong>${'ABCD'[Number(q.CorrectIndex)] || 'A'}</strong></td><td class="flex-row"><button class="btn btn-sm ghost" data-edit-eq="${esc(q.QuestionID)}">Edit</button><button class="btn btn-sm danger" data-del-eq="${esc(q.QuestionID)}">Delete</button></td></tr>
      `).join('')}</tbody></table></div>
    `;
    $('#bankMidBtn')?.addEventListener('click', () => { state.params.adminExamType = 'midterm'; renderAdmin(app, 'exams'); });
    $('#bankFinBtn')?.addEventListener('click', () => { state.params.adminExamType = 'final'; renderAdmin(app, 'exams'); });

    const openEqModal = (existing) => {
      const item = existing || { Question: '', OptionA: '', OptionB: '', OptionC: '', OptionD: '', CorrectIndex: 0, Explanation: '' };
      openModal(`<h3>${existing ? 'Edit Exam MCQ' : 'Add Exam MCQ (' + bankType.toUpperCase() + ')'}</h3><form id="eqForm"><label>Question<textarea name="question" required>${esc(item.Question)}</textarea></label><label>Option A<input name="OptionA" value="${esc(item.OptionA)}" required></label><label>Option B<input name="OptionB" value="${esc(item.OptionB)}" required></label><label>Option C<input name="OptionC" value="${esc(item.OptionC)}" required></label><label>Option D<input name="OptionD" value="${esc(item.OptionD)}" required></label><label>Correct<select name="correctIndex"><option value="0" ${Number(item.CorrectIndex)===0?'selected':''}>A</option><option value="1" ${Number(item.CorrectIndex)===1?'selected':''}>B</option><option value="2" ${Number(item.CorrectIndex)===2?'selected':''}>C</option><option value="3" ${Number(item.CorrectIndex)===3?'selected':''}>D</option></select></label><label>Explanation<input name="explanation" value="${esc(item.Explanation || '')}"></label><div class="flex-row" style="justify-content:flex-end"><button type="button" class="btn ghost" onclick="closeModal()">Cancel</button><button type="submit" class="btn primary">Save</button></div></form>`);
      $('#eqForm').addEventListener('submit', async (e) => {
        e.preventDefault(); const f = e.target;
        const payload = { examType: bankType, question: f.question.value, OptionA: f.OptionA.value, OptionB: f.OptionB.value, OptionC: f.OptionC.value, OptionD: f.OptionD.value, correctIndex: Number(f.correctIndex.value), explanation: f.explanation.value };
        if (existing) payload.questionId = existing.QuestionID;
        const r = await apiCall(existing ? 'updateExamQuestion' : 'createExamQuestion', payload);
        if (r.ok) { toast('Saved', 'ok'); closeModal(); renderAdmin(app, 'exams'); }
      });
    };
    $('#addExamQBtn')?.addEventListener('click', () => openEqModal(null));
    bodyEl.addEventListener('click', async (e) => {
      const eb = e.target.closest('button[data-edit-eq]'); if (eb) { const found = qs.find(x => String(x.QuestionID) === String(eb.dataset.editEq)); if (found) openEqModal(found); return; }
      const db = e.target.closest('button[data-del-eq]'); if (db && confirm('Delete exam question?')) { const r = await apiCall('deleteExamQuestion', { questionId: db.dataset.delEq }); if (r.ok) { toast('Deleted', 'ok'); renderAdmin(app, 'exams'); } }
    });
  }
}

/* ---------- Global Delegation & Boot ---------- */
document.addEventListener('click', (e) => {
  const navBtn = e.target.closest('#mainNav button[data-nav]');
  if (navBtn) { state.view = navBtn.dataset.nav; state.params = {}; $$('#mainNav button').forEach(b => b.classList.toggle('active', b === navBtn)); render(); return; }
  const backBtn = e.target.closest('[data-nav]');
  if (backBtn && backBtn.dataset.nav) { state.view = backBtn.dataset.nav; state.params = {}; render(); return; }
  const submitQuizBtn = e.target.closest('[data-quiz-submit]');
  if (submitQuizBtn) {
    const moduleId = submitQuizBtn.dataset.quizSubmit;
    const answers = [];
    $$('#quizContainer .quiz-q').forEach(qEl => {
      const checked = qEl.querySelector('input[type=radio]:checked');
      if (checked) answers.push({ quizId: qEl.dataset.quizId, chosenIndex: Number(checked.value) });
    });
    if (!answers.length) { toast('Answer at least one question', 'warn'); return; }
    submitQuizBtn.disabled = true; const orig = submitQuizBtn.textContent; submitQuizBtn.textContent = 'Submitting…';
    apiCall('submitQuizGroup', { moduleId, answers }).then(res => {
      submitQuizBtn.disabled = false; submitQuizBtn.textContent = orig;
      if (res.ok) {
        const box = $('#quizResults');
        const pct = Number(res.data.percentage);
        box.innerHTML = `<div class="quiz-result ${pct >= PASS_THRESHOLD ? 'ok' : 'bad'}">Score: ${res.data.score}/${res.data.total} — <strong>${pct}%</strong></div>`;
        box.hidden = false;
        toast('Quiz submitted', 'ok');
      } else toast(res.error || 'Submit failed', 'bad');
    });
  }
});

document.addEventListener('input', debounce(async (e) => {
  const ta = e.target.closest('[data-note-key]');
  if (!ta) return;
  const key = ta.dataset.noteKey;
  state.userData[key] = ta.value;
  await kvSet('userData', state.userData);
  const res = await apiCall('saveUserData', { dataType: 'note', dataKey: key, dataValue: ta.value });
  const statusEl = document.querySelector(`[data-note-status="${key}"]`);
  if (statusEl) { statusEl.textContent = res.queued ? 'Saved locally · will sync' : (res.ok ? 'Saved ✓' : 'Save failed'); statusEl.className = 'note-status ' + (res.ok ? 'ok' : 'bad'); }
}, 700));

document.getElementById('logoutBtn').addEventListener('click', async () => {
  try { await fetchJSON(API_URL, { action: 'logout', token: state.token }); } catch (e) {}
  clearSession(); state.view = 'login'; render();
});

async function boot() {
  updateNetBadge();
  await refreshPendingBadge();
  if (OFFLINE.ENABLED && OFFLINE.SERVICE_WORKER && 'serviceWorker' in navigator) {
    try { await navigator.serviceWorker.register(OFFLINE.SERVICE_WORKER); } catch (e) {}
  }
  if (state.token) {
    const me = await apiCall('me', {});
    if (me.ok && me.data && me.data.user) state.user = me.data.user;
    else if (state.online) clearSession();
  }
  if (!state.token) state.view = 'login';
  else { state.view = 'dashboard'; await preloadAll(); }
  render();
  setInterval(ping, OFFLINE.PING_INTERVAL_MS);
  setInterval(flushQueue, OFFLINE.SYNC_INTERVAL_MS);
  ping();
}

window.addEventListener('online', async () => { state.online = true; updateNetBadge(); await flushQueue(); if (state.token) preloadAll().then(render); });
window.addEventListener('offline', () => { state.online = false; updateNetBadge(); });
window.addEventListener('DOMContentLoaded', boot);
</script>
</body>
